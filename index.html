s often eat lasagne in summer?", "back": "Cold, packed for a picnic or the beach", "frontIt": false, "backIt": false, "note": "Where the British pack sandwiches, an Italian family might pack lasagne.", "say": "le lasagne", "accept": null, "strict": false}, {"id": "9bdc990467", "cat": "cultura", "dir": "drill", "kind": "Culture", "front": "What's a typical mid-morning order at the bar?", "back": "Cappuccino e cornetto, or a caffè", "frontIt": false, "backIt": false, "note": "Around 10:30. A <i>tramezzino<\/i> comes a bit later, around 11.", "say": "un cappuccino e un cornetto", "accept": null, "strict": false}, {"id": "84e8507fb6", "cat": "cultura", "dir": "drill", "kind": "Culture", "front": "Your teacher's take on the word <i>tramezzino<\/i>?", "back": "tra (between) + mezzo (half) + -ino (small): something eaten in between", "frontIt": false, "backIt": false, "note": "Her guess, not a dictionary definition. The word is usually credited to the poet D'Annunzio.", "say": "tramezzino", "accept": null, "strict": false}, {"id": "8cd8005345", "cat": "cultura", "dir": "drill", "kind": "Culture", "front": "Why <i>le lasagne<\/i> and not <i>la lasagna<\/i>?", "back": "The dish is plural in Italian. <i>Una lasagna<\/i> is one sheet.", "frontIt": false, "backIt": false, "note": "Like <i>panini<\/i>: English uses the plural form as a singular.", "say": "le lasagne", "accept": null, "strict": false}, {"id": "4c0b6e8ed4", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “un spuntino”", "back": "uno spuntino", "frontIt": true, "backIt": true, "note": "Masculine + sp-: <i>uno<\/i>.", "say": "uno spuntino", "accept": null, "strict": true}, {"id": "2b301287d7", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “i espressi”", "back": "gli espressi", "frontIt": true, "backIt": true, "note": "Masculine plural + vowel: <i>gli<\/i>.", "say": "gli espressi", "accept": null, "strict": true}, {"id": "2082252d47", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “l'aranciate”", "back": "le aranciate", "frontIt": true, "backIt": true, "note": "No apostrophe in the plural.", "say": "le aranciate", "accept": null, "strict": true}, {"id": "ab58eeef8a", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “le acque tonice”", "back": "le acque toniche", "frontIt": true, "backIt": true, "note": "Keep the hard C with an H.", "say": "le acque toniche", "accept": null, "strict": true}, {"id": "43260716e8", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “due porzione di lasagne”", "back": "due porzioni di lasagne", "frontIt": true, "backIt": true, "note": "<i>porzione<\/i> ends in -e, so -i.", "say": "due porzioni di lasagne", "accept": null, "strict": true}, {"id": "059d332623", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “due succhi di pesche”", "back": "due succhi di pesca", "frontIt": true, "backIt": true, "note": "Only the juice goes plural.", "say": "due succhi di pesca", "accept": null, "strict": true}, {"id": "1ff1cb4988", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “i bicchieri di vino rossi”", "back": "i bicchieri di vino rosso", "frontIt": true, "backIt": true, "note": "<i>rosso<\/i> describes the wine, which stays singular.", "say": "i bicchieri di vino rosso", "accept": null, "strict": true}, {"id": "e1ca298019", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “il zucchero”", "back": "lo zucchero", "frontIt": true, "backIt": true, "note": "Masculine + z: <i>lo<\/i>.", "say": "lo zucchero", "accept": null, "strict": true}, {"id": "4db9150030", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “una lasagna, per favore”", "back": "una porzione di lasagne, per favore", "frontIt": true, "backIt": true, "note": "Order a portion. <i>Lasagne<\/i> is plural.", "say": "una porzione di lasagne, per favore", "accept": null, "strict": true}, {"id": "f82339aa01", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “le acque minerale”", "back": "le acque minerali", "frontIt": true, "backIt": true, "note": "Easy to say because <i>acque<\/i> ends in -e. But <i>minerale<\/i> goes plural too: <i>minerali<\/i>.", "say": "le acque minerali", "accept": null, "strict": true}, {"id": "725a66d5a5", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “le cioccolate bollente”", "back": "le cioccolate bollenti", "frontIt": true, "backIt": true, "note": "Group 2 plural: -i.", "say": "le cioccolate bollenti", "accept": null, "strict": true}, {"id": "1496a75932", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “due birre fresce”", "back": "due birre fresche", "frontIt": true, "backIt": true, "note": "Without the H it would sound like “fresh-eh”.", "say": "due birre fresche", "accept": null, "strict": true}, {"id": "d59b1dee53", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a hot sandwich to eat for lunch", "back": "Vorrei un panino caldo da mangiare a pranzo.", "frontIt": false, "backIt": true, "note": "A <i>panino<\/i>, not a <i>tramezzino<\/i>: those are never hot.", "say": "Vorrei un panino caldo da mangiare a pranzo.", "accept": ["vorrei un panino caldo da mangiare per pranzo"], "strict": false}, {"id": "8d263a09a0", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order two peach juices and two tuna-pasta portions", "back": "Vorrei due succhi di pesca e due porzioni di pasta tonnata.", "frontIt": false, "backIt": true, "note": null, "say": "Vorrei due succhi di pesca e due porzioni di pasta tonnata.", "accept": null, "strict": false}, {"id": "ec4c5887c9", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a portion of cold lasagne and a tonic water", "back": "Vorrei una porzione di lasagne fredde e un'acqua tonica.", "frontIt": false, "backIt": true, "note": null, "say": "Vorrei una porzione di lasagne fredde e un'acqua tonica.", "accept": null, "strict": false}, {"id": "56638b2c27", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order two bruschettas and two glasses of red wine", "back": "Vorrei due bruschette e due bicchieri di vino rosso.", "frontIt": false, "backIt": true, "note": null, "say": "Vorrei due bruschette e due bicchieri di vino rosso.", "accept": null, "strict": false}, {"id": "9b72fc54ad", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a packet of crisps and an ice-cold beer", "back": "Vorrei un pacchetto di patatine e una birra ghiacciata.", "frontIt": false, "backIt": true, "note": null, "say": "Vorrei un pacchetto di patatine e una birra ghiacciata.", "accept": null, "strict": false}, {"id": "4c5dbbf461", "cat": "dialogo", "dir": "drill", "kind": "Role play", "front": "The waiter asks “Freddo o caldo?” about your tea. You want it boiling hot.", "back": "Bollente, grazie.", "frontIt": false, "backIt": true, "note": null, "say": "Bollente, grazie.", "accept": null, "strict": false}, {"id": "999f94e996", "cat": "dialogo", "dir": "drill", "kind": "Understand", "front": "“Abito a Milano. Vorrei un tramezzino e un succo di pera.” What does she want?", "back": "A sandwich and a pear juice. She lives in Milan.", "frontIt": true, "backIt": false, "note": null, "say": "Abito a Milano. Vorrei un tramezzino e un succo di pera.", "accept": null, "strict": false}, {"id": "aea7302a17", "cat": "dialogo", "dir": "drill", "kind": "Understand", "front": "“Due spuntini, due aperitivi ghiacciati e gli stuzzichini, grazie.” What's the order?", "back": "Two snacks, two ice-cold aperitifs and the bar nibbles, thanks.", "frontIt": true, "backIt": false, "note": "<i>Stuzzichini<\/i> = bar nibbles. A bonus word.", "say": "Due spuntini, due aperitivi ghiacciati e gli stuzzichini, grazie.", "accept": null, "strict": false}], "notes": "<section>\n      <h2>“The” at a glance<\/h2>\n      <div class=\"tbl-wrap\"><table class=\"glance\">\n        <tr><th>Noun starts with<\/th><th>Masc. sing.<\/th><th>Masc. plural<\/th><th>Fem. sing.<\/th><th>Fem. plural<\/th><\/tr>\n        <tr><td>Consonant<\/td><td class=\"it-cell\">il<\/td><td class=\"it-cell\">i<\/td><td class=\"it-cell\">la<\/td><td class=\"it-cell\">le<\/td><\/tr>\n        <tr><td>s + consonant, z<\/td><td class=\"it-cell\">lo<\/td><td class=\"it-cell\">gli<\/td><td class=\"it-cell\">la<\/td><td class=\"it-cell\">le<\/td><\/tr>\n        <tr><td>Vowel<\/td><td class=\"it-cell\">l'<\/td><td class=\"it-cell\">gli<\/td><td class=\"it-cell\">l'<\/td><td class=\"it-cell\">le<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>Feminine is simple: <i>la<\/i> (or <i>l'<\/i> before a vowel) and always <i>le<\/i> in the plural.<\/li>\n        <li>Never an apostrophe in the plural: <i>le aranciate<\/i>, <i>gli espressi<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>“The” in full<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Article<\/th><th>Used with<\/th><th>Examples<\/th><\/tr>\n        <tr><td class=\"it-cell\">il<\/td><td>masculine singular, starting with a consonant<\/td><td class=\"it-cell\">il ragazzo, il telefonino<\/td><\/tr>\n        <tr><td class=\"it-cell\">lo<\/td><td>masculine singular, starting with s + consonant or z (also gn, pn, ps, x, y)<\/td><td class=\"it-cell\">lo studente, lo zio, lo yogurt, lo spuntino, lo zucchero<\/td><\/tr>\n        <tr><td class=\"it-cell\">l'<\/td><td>any singular noun starting with a vowel<\/td><td class=\"it-cell\">l'ospedale, l'aranciata, l'espresso<\/td><\/tr>\n        <tr><td class=\"it-cell\">i<\/td><td>masculine plural, starting with a consonant<\/td><td class=\"it-cell\">i fratelli, i tablet<\/td><\/tr>\n        <tr><td class=\"it-cell\">gli<\/td><td>masculine plural, starting with s + consonant or z, <b>and<\/b> any masculine plural starting with a vowel<\/td><td class=\"it-cell\">gli studenti, gli zii, gli yogurt, gli amici, gli orari, gli espressi<\/td><\/tr>\n        <tr><td class=\"it-cell\">la<\/td><td>feminine singular, starting with a consonant<\/td><td class=\"it-cell\">la ragazza, la macchina<\/td><\/tr>\n        <tr><td class=\"it-cell\">le<\/td><td>all feminine plurals, consonant or vowel<\/td><td class=\"it-cell\">le ragazze, le amiche, le aranciate<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>The ones you must know now: s + consonant and z. Words with gn, pn, ps, x and y are rare. <i>Lo gnocco, gli gnocchi<\/i> is the one you'll see.<\/li>\n        <li>Foreign words don't change in the plural: <i>il tablet → i tablet<\/i>, <i>lo yogurt → gli yogurt<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Singular to plural<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>a / an<\/th><th>the<\/th><th>the (plural)<\/th><\/tr>\n        <tr><td class=\"it-cell\">un succo di pesca<\/td><td class=\"it-cell\">il succo di pesca<\/td><td class=\"it-cell\">i succhi di pesca<\/td><\/tr>\n        <tr><td class=\"it-cell\">uno spuntino<\/td><td class=\"it-cell\">lo spuntino<\/td><td class=\"it-cell\">gli spuntini<\/td><\/tr>\n        <tr><td class=\"it-cell\">un tramezzino<\/td><td class=\"it-cell\">il tramezzino<\/td><td class=\"it-cell\">i tramezzini<\/td><\/tr>\n        <tr><td class=\"it-cell\">un espresso<\/td><td class=\"it-cell\">l'espresso<\/td><td class=\"it-cell\">gli espressi<\/td><\/tr>\n        <tr><td class=\"it-cell\">un aperitivo<\/td><td class=\"it-cell\">l'aperitivo<\/td><td class=\"it-cell\">gli aperitivi<\/td><\/tr>\n        <tr><td class=\"it-cell\">una bruschetta<\/td><td class=\"it-cell\">la bruschetta<\/td><td class=\"it-cell\">le bruschette<\/td><\/tr>\n        <tr><td class=\"it-cell\">un'acqua tonica<\/td><td class=\"it-cell\">l'acqua tonica<\/td><td class=\"it-cell\">le acque toniche<\/td><\/tr>\n        <tr><td class=\"it-cell\">un'aranciata<\/td><td class=\"it-cell\">l'aranciata<\/td><td class=\"it-cell\">le aranciate<\/td><\/tr>\n        <tr><td class=\"it-cell\">una porzione di lasagne<\/td><td class=\"it-cell\">la porzione di lasagne<\/td><td class=\"it-cell\">le porzioni di lasagne<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>Get the ending right. Everything else (article, adjective) depends on it.<\/li>\n        <li>Keep the hard sound with an H: <i>succo → succhi<\/i>, <i>tonica → toniche<\/i>, <i>pacchetto<\/i>, <i>fresca → fresche<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>A portion of…, a glass of…<\/h2>\n      <div class=\"plaque\" aria-label=\"due porzioni di lasagne\">\n        <div><span class=\"w\">due porzioni<\/span><span class=\"l\">this goes plural<\/span><\/div>\n        <div><span class=\"w\">di lasagne<\/span><span class=\"l\">this stays as it is<\/span><\/div>\n      <\/div>\n      <ul>\n        <li>Only the first noun changes, as in English: a portion of cake, two portions of cake.<\/li>\n        <li><i>un bicchiere di vino rosso → i bicchieri di vino rosso<\/i>. The wine stays singular, so <i>rosso<\/i> does too.<\/li>\n        <li><i>un bicchiere rosso → i bicchieri rossi<\/i>. Here the glass is red, so the adjective changes with it.<\/li>\n        <li>The adjective agrees with the word it describes: <i>la porzione di pasta tonnata calda → le porzioni di pasta tonnata calda<\/i> (the pasta is hot).<\/li>\n        <li><i>Lasagne<\/i> is already plural in Italian, so cold lasagne is <i>lasagne fredde<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Adjectives recap<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th><\/th><th>Masc. sing.<\/th><th>Fem. sing.<\/th><th>Masc. plural<\/th><th>Fem. plural<\/th><\/tr>\n        <tr><td>cold<\/td><td class=\"it-cell\">freddo<\/td><td class=\"it-cell\">fredda<\/td><td class=\"it-cell\">freddi<\/td><td class=\"it-cell\">fredde<\/td><\/tr>\n        <tr><td>cool, fresh<\/td><td class=\"it-cell\">fresco<\/td><td class=\"it-cell\">fresca<\/td><td class=\"it-cell\">freschi<\/td><td class=\"it-cell\">fresche<\/td><\/tr>\n        <tr><td>red<\/td><td class=\"it-cell\">rosso<\/td><td class=\"it-cell\">rossa<\/td><td class=\"it-cell\">rossi<\/td><td class=\"it-cell\">rosse<\/td><\/tr>\n        <tr><td>boiling hot<\/td><td class=\"it-cell\">bollente<\/td><td class=\"it-cell\">bollente<\/td><td class=\"it-cell\">bollenti<\/td><td class=\"it-cell\">bollenti<\/td><\/tr>\n        <tr><td>mineral<\/td><td class=\"it-cell\">minerale<\/td><td class=\"it-cell\">minerale<\/td><td class=\"it-cell\">minerali<\/td><td class=\"it-cell\">minerali<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li><i>Fresco<\/i> means cool or fresh. The context tells you which.<\/li>\n        <li><i>molto<\/i> (very) and <i>troppo<\/i> (too) never change.<\/li>\n        <li><i>l'acqua minerale → le acque minerali<\/i>. All three parts change.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Cocktail words<\/h2>\n      <div class=\"grid-cells\">\n        <div class=\"cell\"><span class=\"k\">ice<\/span><span class=\"v\">il ghiaccio<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">ice cubes<\/span><span class=\"v\">i cubetti di ghiaccio<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">slice of lemon<\/span><span class=\"v\">la fetta di limone<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">tonic water<\/span><span class=\"v\">l'acqua tonica<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">drops<\/span><span class=\"v\">le gocce<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">sugar<\/span><span class=\"v\">lo zucchero<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">1 tsp of sugar<\/span><span class=\"v\">un cucchiaino di zucchero<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">glass<\/span><span class=\"v\">il bicchiere<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">tomato juice<\/span><span class=\"v\">il succo di pomodoro<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">salt and pepper<\/span><span class=\"v\">sale e pepe<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">a splash of soda<\/span><span class=\"v\">uno spruzzo di soda<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">a little cherry<\/span><span class=\"v\">una ciliegina<\/span><\/div>\n      <\/div>\n      <p class=\"src\">Recipe verbs: <i>versare<\/i> (to pour), <i>aggiungere<\/i> (to add), <i>riempire<\/i> (to fill), <i>decorare<\/i> (to decorate). <i>Con<\/i> = with, <i>senza<\/i> = without.<\/p>\n    <\/section>\n\n    <section>\n      <h2>At the bar<\/h2>\n      <ul>\n        <li><b>Il tramezzino<\/b>: a soft, crustless white-bread triangle with fillings like tomato and mozzarella, egg, or tuna. Sold in bars and eaten as a snack around 11. Never toasted. Your teacher's guess at the word: <i>tra<\/i> (between) + <i>mezzo<\/i> (half) + <i>-ino<\/i> (small). It's usually credited to the poet Gabriele D'Annunzio, as an Italian word for “sandwich”.<\/li>\n        <li><b>Lo spuntino<\/b>: more than a bite, less than a meal. A bit of cheese, a few grapes.<\/li>\n        <li>Mid-morning, around 10:30: <i>cappuccino e cornetto<\/i>. A tramezzino comes a bit later.<\/li>\n        <li><b>Le lasagne<\/b> are often eaten cold in summer, packed for a picnic or the beach.<\/li>\n        <li><b>L'aperitivo<\/b>: many bars put out crisps, nuts and small snacks free with your drink.<\/li>\n        <li>Italy has more juices than the UK: <i>pesca<\/i> (peach), <i>pera<\/i> (pear), <i>albicocca<\/i> (apricot).<\/li>\n        <li>Order with <i>Vorrei…<\/i> (I would like…). <i>Vorrei un tè. Freddo o caldo? Bollente, grazie.<\/i><\/li>\n      <\/ul>\n    <\/section>"}, {"id": "cbi-1-04", "eyebrow": "Coffee Break Italian · Season 1, Lesson 4", "title": "Abito a Firenze", "sub": "Saying where you live: <i>a<\/i> for towns, <i>in<\/i> for countries, <i>sono di… ma adesso abito a…<\/i>, plus country names and a recap of nationalities.", "cats": [[" , "back": "“ts”", "frontIt": false, "backIt": false, "note": "SCO-tsya, ZVE-tsya.", "say": "Scozia, Svezia", "accept": null, "strict": false}, {"id": "631bc11434", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>gi<\/i> in <i>Giappone<\/i>, <i>Germania<\/i> sounds like…", "back": "“j”, as in jam", "frontIt": false, "backIt": false, "note": "jap-PO-ne, jer-MA-nya.", "say": "Giappone, Germania", "accept": null, "strict": false}, {"id": "069376feb9", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "Where's the stress in <i>Genova<\/i>?", "back": "GE-nova (first syllable)", "frontIt": false, "backIt": false, "note": null, "say": "Genova", "accept": null, "strict": false}, {"id": "bf9b54e5ac", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>zz<\/i> in <i>scozzese<\/i>, <i>svizzero<\/i> sounds like…", "back": "a long “ts”", "frontIt": false, "backIt": false, "note": "Hold the double consonant: scot-TSE-ze.", "say": "scozzese, svizzero", "accept": null, "strict": false}], "notes": "<section>\n      <h2>The questions<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th><\/th><th>Informal (tu)<\/th><th>Formal (Lei)<\/th><\/tr>\n        <tr><td>Where do you live?<\/td><td class=\"it-cell\">Dove abit<span class=\"st\">i<\/span>?<\/td><td class=\"it-cell\">Dove abit<span class=\"st\">a<\/span>?<\/td><\/tr>\n        <tr><td>Where are you from?<\/td><td class=\"it-cell\">Di dove sei?<\/td><td class=\"it-cell\">Di dov'è?<\/td><\/tr>\n        <tr><td>Are you Italian?<\/td><td class=\"it-cell\">Sei italiano / italiana?<\/td><td class=\"it-cell\">È italiano / italiana?<\/td><\/tr>\n      <\/table><\/div>\n    <\/section>\n\n    <section>\n      <h2>A, in, negli<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Place<\/th><th>Word<\/th><th>Example<\/th><\/tr>\n        <tr><td>Town or city<\/td><td class=\"it-cell\">a<\/td><td class=\"it-cell\">Abito a Firenze.<\/td><\/tr>\n        <tr><td>Country<\/td><td class=\"it-cell\">in<\/td><td class=\"it-cell\">Abito in Scozia.<\/td><\/tr>\n        <tr><td>Plural country<\/td><td class=\"it-cell\">negli<\/td><td class=\"it-cell\">Abito negli Stati Uniti.<\/td><\/tr>\n        <tr><td>Country with “il”<\/td><td class=\"it-cell\">nel<\/td><td class=\"it-cell\">Abito nel Principato di Monaco.<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>Town first, then country: <i>Abito a Glasgow, in Scozia.<\/i><\/li>\n        <li><i>negli<\/i> = <i>in<\/i> + <i>gli<\/i> (the). <i>nel<\/i> = <i>in<\/i> + <i>il<\/i>.<\/li>\n        <li>Singular countries take plain <i>in<\/i>, whether masculine or feminine: <i>in Italia<\/i>, <i>in Canada<\/i>, <i>in Giappone<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>From one place, living in another<\/h2>\n      <div class=\"plaque\" aria-label=\"Sono di Torino ma adesso abito a Glasgow\">\n        <div><span class=\"w\">Sono di Torino<\/span><span class=\"l\">where you're from<\/span><\/div>\n        <div><span class=\"w\">ma adesso<\/span><span class=\"l\">but now<\/span><\/div>\n        <div><span class=\"w\">abito a Glasgow<\/span><span class=\"l\">where you live<\/span><\/div>\n      <\/div>\n      <ul>\n        <li><i>Sono di<\/i> + a town. For a country, use your nationality: <i>Sono inglese<\/i>.<\/li>\n        <li><i>Anch'io<\/i> = me too / I also: <i>Anch'io abito a Firenze.<\/i><\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Countries<\/h2>\n      <div class=\"grid-cells\"><div class=\"cell\"><span class=\"k\">Italy<\/span><span class=\"v\">Italia<\/span><\/div><div class=\"cell\"><span class=\"k\">England<\/span><span class=\"v\">Inghilterra<\/span><\/div><div class=\"cell\"><span class=\"k\">Scotland<\/span><span class=\"v\">Scozia<\/span><\/div><div class=\"cell\"><span class=\"k\">Wales<\/span><span class=\"v\">Galles<\/span><\/div><div class=\"cell\"><span class=\"k\">Ireland<\/span><span class=\"v\">Irlanda<\/span><\/div><div class=\"cell\"><span class=\"k\">United States<\/span><span class=\"v\">Stati Uniti<\/span><\/div><div class=\"cell\"><span class=\"k\">Canada<\/span><span class=\"v\">Canada<\/span><\/div><div class=\"cell\"><span class=\"k\">Australia<\/span><span class=\"v\">Australia<\/span><\/div><div class=\"cell\"><span class=\"k\">New Zealand<\/span><span class=\"v\">Nuova Zelanda<\/span><\/div><div class=\"cell\"><span class=\"k\">Spain<\/span><span class=\"v\">Spagna<\/span><\/div><div class=\"cell\"><span class=\"k\">Germany<\/span><span class=\"v\">Germania<\/span><\/div><div class=\"cell\"><span class=\"k\">Greece<\/span><span class=\"v\">Grecia<\/span><\/div><div class=\"cell\"><span class=\"k\">Denmark<\/span><span class=\"v\">Danimarca<\/span><\/div><div class=\"cell\"><span class=\"k\">Sweden<\/span><span class=\"v\">Svezia<\/span><\/div><div class=\"cell\"><span class=\"k\">Norway<\/span><span class=\"v\">Norvegia<\/span><\/div><div class=\"cell\"><span class=\"k\">Finland<\/span><span class=\"v\">Finlandia<\/span><\/div><div class=\"cell\"><span class=\"k\">Russia<\/span><span class=\"v\">Russia<\/span><\/div><div class=\"cell\"><span class=\"k\">China<\/span><span class=\"v\">Cina<\/span><\/div><div class=\"cell\"><span class=\"k\">Japan<\/span><span class=\"v\">Giappone<\/span><\/div><\/div>\n      <ul>\n        <li>Countries take a capital letter. Nationalities and languages don't: <i>l'Italia<\/i> but <i>italiano<\/i>.<\/li>\n        <li><i>Monaco<\/i> on its own usually means Munich. The principality is <i>il Principato di Monaco<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Nationalities (lesson 3 recap)<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Type<\/th><th>Man<\/th><th>Woman<\/th><th>English<\/th><\/tr>\n        <tr><td>-o / -a<\/td><td class=\"it-cell\">italiano<\/td><td class=\"it-cell\">italiana<\/td><td>Italian<\/td><\/tr>\n        <tr><td><\/td><td class=\"it-cell\">americano<\/td><td class=\"it-cell\">americana<\/td><td>American<\/td><\/tr>\n        <tr><td><\/td><td class=\"it-cell\">australiano<\/td><td class=\"it-cell\">australiana<\/td><td>Australian<\/td><\/tr>\n        <tr><td><\/td><td class=\"it-cell\">austriaco<\/td><td class=\"it-cell\">austriaca<\/td><td>Austrian<\/td><\/tr>\n        <tr><td><\/td><td class=\"it-cell\">svizzero<\/td><td class=\"it-cell\">svizzera<\/td><td>Swiss<\/td><\/tr>\n        <tr><td><\/td><td class=\"it-cell\">tedesco<\/td><td class=\"it-cell\">tedesca<\/td><td>German<\/td><\/tr>\n        <tr><td>-ese (no change)<\/td><td class=\"it-cell\" colspan=\"2\">inglese · scozzese · francese · canadese · cinese<\/td><td>English, Scottish, French, Canadian, Chinese<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>Negative: put <i>non<\/i> before the verb. <i>Non sono francese.<\/i><\/li>\n      <\/ul>\n    <\/section>\n    <p class=\"src\">Built from the lesson page on coffeebreaklanguages.com and the episode's published vocabulary, not from the audio.<\/p>"}]</script>
<script>
(function () {
  "use strict";
  const DECKS = JSON.parse(document.getElementById("deck-data").textContent);
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = t => String(t || "").replace(/<[^>]+>/g, "");

  // ---------- Storage (progress stays in this browser) ----------
  const KEY = "italiano-flashcards-v1";
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { S = null; }
  if (!S || S.v !== 1) S = { v: 1, cards: {}, log: {}, tests: [], settings: {} };
  S.settings = Object.assign({ newPerDay: 15, dir: "both", typing: false, testSize: 10, cats: {}, theme: "" }, S.settings);
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  if (S.settings.theme) document.documentElement.setAttribute("data-theme", S.settings.theme);

  // ---------- Days (a new day starts at 4am) ----------
  function dayNum(t) { const d = new Date(t || Date.now()); d.setHours(d.getHours() - 4); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
  const today = () => dayNum();
  function dayLabel(n) { const d = new Date(n * 864e5); return ["S", "M", "T", "W", "T", "F", "S"][d.getUTCDay()]; }
  function dayShort(n) { const d = new Date(n * 864e5); return d.getUTCDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()]; }

  // ---------- Spaced repetition ----------
  // Ratings: 1 Again, 2 Hard, 3 Good, 4 Easy. iv = interval in days; mastered once iv >= 21.
  const MASTERED = 21;
  function schedule(prev, r) {
    const p = prev || { iv: 0, ease: 2.5, reps: 0, lapses: 0 };
    let iv = p.iv, ease = p.ease;
    if (r === 1) { if (p.iv > 0) ease = Math.max(1.3, ease - 0.2); iv = 0; }
    else if (r === 2) { ease = Math.max(1.3, ease - 0.15); iv = Math.max(1, Math.round(p.iv * 1.2)); }
    else if (r === 3) { iv = p.iv === 0 ? 1 : p.iv === 1 ? 3 : Math.round(p.iv * ease); }
    else { ease = ease + 0.15; iv = p.iv === 0 ? 4 : Math.round(Math.max(p.iv + 1, p.iv * ease * 1.3)); }
    iv = Math.min(iv, 365);
    return { iv, ease: Math.round(ease * 100) / 100, reps: p.reps + 1, lapses: p.lapses + (r === 1 && p.iv > 0 ? 1 : 0), due: today() + iv, last: today() };
  }
  function ivLabel(iv) { return iv === 0 ? "again" : iv < 30 ? iv + "d" : iv < 365 ? Math.round(iv / 30) + "mo" : "1y"; }
  const cardState = (deck, id) => (S.cards[deck] || {})[id];
  function status(deck, c) {
    const st = cardState(deck, c.id);
    if (!st) return "new";
    if (st.iv >= MASTERED) return st.due <= today() ? "due" : "mastered";
    return st.due <= today() ? "due" : "learning";
  }

  // ---------- Daily log ----------
  function logDay(d) { return S.log[d] || (S.log[d] = { n: 0, rev: 0, ok: 0, nw: 0, decks: {} }); }
  function logDeck(d, deck) { const L = logDay(d); return L.decks[deck] || (L.decks[deck] = { n: 0, rev: 0, ok: 0, nw: 0 }); }
  function streak() {
    let d = today(), n = 0;
    if (!(S.log[d] && S.log[d].n)) d -= 1;
    while (S.log[d] && S.log[d].n) { n++; d--; }
    return n;
  }

  // ---------- Deck helpers ----------
  const deckById = id => DECKS.find(d => d.id === id) || DECKS[0];
  function selectedCats(deck) { const c = S.settings.cats[deck.id]; return c && c.length ? new Set(c) : new Set(deck.cats.map(x => x[0])); }
  function eligible(deck) {
    const cats = selectedCats(deck), dir = S.settings.dir;
    return deck.cards.filter(c => cats.has(c.cat) && (c.dir === "drill" || dir === "both" || c.dir === dir));
  }
  function counts(deck, list) {
    const o = { new: 0, learning: 0, due: 0, mastered: 0 };
    (list || deck.cards).forEach(c => o[status(deck.id, c)]++);
    return o;
  }
  function newLeftToday(deck) { const L = (S.log[today()] || { decks: {} }).decks[deck.id]; return Math.max(0, S.settings.newPerDay - (L ? L.nw : 0)); }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const catLabel = (deck, id) => (deck.cats.find(c => c[0] === id) || [, ""])[1];
  const dirLabel = c => c.dir === "it-en" ? "IT → EN" : c.dir === "en-it" ? "EN → IT" : (c.kind || "Drill");

  // ---------- Audio ----------
  function sayFront(c) {
    if (!c.frontIt) return null;
    if (c.dir !== "drill") return c.say;
    const f = plain(c.front);
    if (f.includes("___")) return null;
    if (/^(Fix|A woman says)/.test(f)) return null;
    const q = f.match(/“([^”]+)”/);
    if (q) return q[1];
    if (!c.backIt && c.say) return c.say;
    return f.split("→")[0];
  }
  function sayBack(c) { if (c.dir !== "drill") return c.say; if (c.say) return c.say; return c.backIt ? c.back : null; }
  function clean(t) {
    return plain(t).replace(/\s*\+\s*/g, " più ").replace(/\s*[−-]\s+/g, " meno ").replace(/\s*=\s*\??/g, "")
      .replace(/\([^)]*\)/g, " ").replace(/[·\/→…“”"]/g, ", ").replace(/_+/g, " ")
      .replace(/\s*,\s*(,\s*)+/g, ", ").replace(/\s+/g, " ").trim().replace(/^,\s*|,\s*$/g, "");
  }
  const canSpeak = "speechSynthesis" in window;
  let voices = [];
  function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
  if (canSpeak) { loadVoices(); try { speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch (e) {} }
  function speak(t) {
    if (!canSpeak) return;
    try {
      const text = clean(t); if (!text) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "it-IT"; u.rate = 0.9;
      if (!voices.length) loadVoices();
      const v = voices.find(v => /^it[-_]IT/i.test(v.lang || "")) || voices.find(v => /^it/i.test(v.lang || ""));
      if (v) u.voice = v;
      window.__utt = u;
      const go = () => { try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch (e) {} };
      if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 80); } else go();
    } catch (e) {}
  }
  const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
  const sayBtn = t => canSpeak && t ? '<button class="say" data-say="' + esc(t) + '" aria-label="Listen in Italian">' + SPK + "Ascolta</button>" : "";

  // ---------- Answer checking (typing) ----------
  function norm(t, keepAccents, strict) {
    let s = plain(t).replace(/\([^)]*\)/g, " ").toLowerCase();
    if (!keepAccents) s = s.normalize("NFD").replace(/[̀-ͯ]/g, "");
    s = s.replace(/[’']/g, " ").replace(/[“”"?!.,;:…·\-–—]/g, " ").replace(/\s+/g, " ").trim();
    if (!strict) s = s.replace(/^(il|la|lo|l|i|gli|le|the|a|an|to) /, "");
    return s;
  }
  function check(c, v) {
    const opts = (c.accept || []).concat(c.back.split(/\s\/\s|;/), [c.back]);
    if (opts.some(o => norm(o, true, c.strict) === norm(v, true, c.strict))) return "ok";
    if (opts.some(o => norm(o, false, c.strict) === norm(v, false, c.strict))) return "close";
    return "no";
  }

  // ---------- App state ----------
  const ui = { deck: null, mode: "study", sess: null, test: null, flipped: false };
  const MODES = [["study", "Study"], ["test", "Test"], ["progress", "Progress"], ["notes", "Notes"]];
  function routeDeck() { const h = (location.hash || "").slice(1); return DECKS.some(d => d.id === h) ? h : (S.settings.lastDeck && DECKS.some(d => d.id === S.settings.lastDeck) ? S.settings.lastDeck : DECKS[DECKS.length - 1].id); }

  // ---------- Sidebar ----------
  function ring(pct, size, cls) {
    const r = 15, C = 2 * Math.PI * r;
    return '<svg class="' + (cls || "ring") + '" viewBox="0 0 40 40" width="' + size + '" height="' + size + '" aria-hidden="true"><circle class="bg" cx="20" cy="20" r="' + r + '" fill="none" stroke-width="3.5"/><circle class="fg" cx="20" cy="20" r="' + r + '" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(2) + '" transform="rotate(-90 20 20)"/><text x="20" y="23.5" text-anchor="middle">' + Math.round(pct * 100) + "</text></svg>";
  }
  const FLAME = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1.2 2.6 2.3 3C10.6 8 11.5 5 12 2z"/></svg>';
  function renderSide() {
    const s = streak();
    $("#streak").outerHTML = '<span id="streak" class="streak' + (s ? " on" : "") + '" title="Days in a row with at least one review">' + FLAME + s + (s === 1 ? " day" : " days") + "</span>";
    $("#streak-top").outerHTML = '<span id="streak-top" class="streak' + (s ? " on" : "") + '">' + FLAME + s + "</span>";
    $("#decks").innerHTML = DECKS.map(d => {
      const c = counts(d), pct = c.mastered / d.cards.length;
      const due = c.due + Math.min(c.new, newLeftToday(d));
      return '<button class="deck-btn" data-deck="' + d.id + '" aria-current="' + (d.id === ui.deck) + '" title="' + Math.round(pct * 100) + '% mastered">' + ring(pct, 40) +
        '<span style="min-width:0"><span class="e">' + esc(d.eyebrow.replace(/^Italiano · /, "")) + '</span><span class="t">' + d.title + "</span></span>" +
        '<span class="due' + (due ? "" : " zero") + '" title="Cards to study today">' + due + "</span></button>";
    }).join("");
  }

  // ---------- Main render ----------
  function render() {
    const d = deckById(ui.deck);
    renderSide();
    $("#top-title").innerHTML = d.title;
    document.title = plain(d.title) + " · Italiano";
    let html = '<header class="deck-head"><span class="label">' + esc(d.eyebrow) + "</span><h2>" + d.title + "</h2><p>" + d.sub + "</p></header>";
    html += '<nav class="tabs" role="tablist">' + MODES.map(m => '<button class="tab" role="tab" data-mode="' + m[0] + '" aria-selected="' + (ui.mode === m[0]) + '">' + m[1] + "</button>").join("") + "</nav>";
    html += '<div id="view"></div>';
    $("#col").innerHTML = html;
    renderView();
  }
  function renderView() {
    const d = deckById(ui.deck), v = $("#view");
    if (ui.mode === "study") v.innerHTML = ui.sess ? (ui.sess.done ? studyDone(d) : studyCard(d)) : studyHome(d);
    else if (ui.mode === "test") v.innerHTML = ui.test ? (ui.test.finished ? testDone(d) : testQ(d)) : testHome(d);
    else if (ui.mode === "progress") v.innerHTML = progress(d);
    else v.innerHTML = '<div class="notes">' + d.notes + "</div>";
    if (ui.mode === "study" && ui.sess && !ui.sess.done && S.settings.typing && !ui.flipped) { const i = $("#answer"); if (i) setTimeout(() => { try { i.focus({ preventScroll: true }); } catch (e) {} }, 40); }
  }

  // ---------- Study ----------
  function optionsBlock(d, forTest) {
    const cats = selectedCats(d), el = eligible(d);
    const chips = d.cats.map(([id, label]) => {
      const n = d.cards.filter(c => c.cat === id && (c.dir === "drill" || S.settings.dir === "both" || c.dir === S.settings.dir)).length;
      return '<button class="chip" data-cat="' + id + '" aria-pressed="' + cats.has(id) + '">' + label + ' <span class="c">' + n + "</span></button>";
    }).join("");
    const dirs = [["both", "Both ways"], ["it-en", "IT → EN"], ["en-it", "EN → IT"]].map(([v, l]) => '<button data-dir="' + v + '" aria-pressed="' + (S.settings.dir === v) + '">' + l + "</button>").join("");
    const extra = forTest
      ? '<div class="opt-line"><span class="label">Questions</span><div class="seg">' + [10, 20, 30].map(n => '<button data-tsize="' + n + '" aria-pressed="' + (S.settings.testSize === n) + '">' + n + "</button>").join("") + "</div></div>"

  function startSession(d, extra) {

      const nw = shuffle(el.filter(c => status(d.id, c) === "new")).slice(0, newLeftToday(d));
      q = shuffle(due.slice(0, 200));

    }
    if (!q.length) return;
    ui.sess = { q, total: q.length, finished: 0, again: 0, seen: new Set(), ratings: [0, 0, 0, 0, 0], extra: !!extra, done: false };
    ui.flipped = false; ui.verdict = null;
    renderView();
  }
  function studyCard(d) {
    const s = ui.sess, c = s.q[0], prev = cardState(d.id, c.id);
    const pDone = s.finished / s.total * 100, pAgain = Math.min(100 - pDone, s.q.filter(x => s.seen.has(x.id)).length / s.total * 100);
    const big = t => plain(t).length > 34 ? " small" : "";
    const fs = sayFront(c), bs = sayBack(c);

    let h = '<div class="sess-top"><button class="linkish" data-act="quit">← End</button><div class="pbar" aria-hidden="true"><i style="width:' + pDone + '%"></i><i class="again" style="width:' + pAgain + '%"></i></div><span class="mono" style="font-size:12px;color:var(--ink-3)">' + s.finished + " / " + s.total + "</span></div>";
    h += '<div class="stage"><div class="card' + (ui.flipped ? " flipped" : "") + '" id="card" tabindex="0" aria-label="Flashcard. Press space to flip."><div class="card-inner">' +
      '<div class="face front"><div class="meta"><span class="label">' + esc(dirLabel(c)) + '</span><span class="label">' + esc(tag) + " · " + esc(catLabel(d, c.cat)) + '</span></div><div class="body"><div class="' + (c.frontIt ? "it" : "en") + big(c.front) + '">' + c.front + "</div>" + (hint ? '<div class="hint">' + hint + "</div>" : "") + (fs ? sayBtn(fs) : "") + "</div></div>" +
      '<div class="face back"><div class="meta"><span class="label">Answer</span><span class="label">' + esc(catLabel(d, c.cat)) + '</span></div><div class="body"><div class="' + (c.backIt ? "it" : "en") + big(c.back) + '">' + c.back + "</div>" + (bs ? sayBtn(bs) : "") + "</div>" + (c.note ? '<div class="note">' + c.note + "</div>" : "") + "</div>" +
      "</div></div></div>";
    if (S.settings.typing && !ui.flipped) h += '<form class="typebox" id="typeform"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer, then Enter" aria-label="Your answer"><button class="btn" type="submit">Check</button></form>';

  }
  function flip() { if (!ui.sess || ui.sess.done || ui.flipped) return; ui.flipped = true; const card = $("#card"); if (card) card.classList.add("flipped"); setTimeout(renderView, card ? 280 : 0); }
  function rate(r) {
    const s = ui.sess; if (!s || s.done || !ui.flipped) return;
    const d = deckById(ui.deck), c = s.q.shift(), prev = cardState(d.id, c.id);

    s.ratings[r]++;

  function studyDone(d) {

      '<div class="stack" title="Again, Hard, Good, Easy">' + [[1, "var(--brick)"], [2, "var(--amber)"], [3, "var(--ink)"], [4, "var(--sage)"]].map(([k, col]) => '<i style="width:' + (n ? r[k] / n * 100 : 0) + "%;background:" + col + '"></i>').join("") + "</div>" +

  // ---------- Test (multiple choice) ----------
  function testHome(d) {
    const best = S.tests.filter(t => t.deck === d.id).slice(-1)[0];
    return '<section class="panel"><span class="label">Multiple choice</span><p style="margin:0">' + S.settings.testSize + " questions from the topics you've picked. Four options each, no second tries. Tests don't change your study schedule.</p>" +
      (best ? '<p class="hint" style="margin:0">Last test: ' + best.score + " / " + best.total + " on " + dayShort(best.day) + ".</p>" : "") +
      '<div class="row"><button class="btn primary" data-act="test">Start test <span class="kbd">Enter</span></button></div></section>' + optionsBlock(d, true);
  }
  function makeTest(d, cards) {
    const pool = eligible(d);
    const key = c => norm(c.back, false, true);
    const qs = cards.map(c => {
      const k = key(c), accept = new Set((c.accept || []).map(a => norm(a, false, true)));
      const pick = list => shuffle(list.filter(o => o.backIt === c.backIt && key(o) !== k && !accept.has(key(o))));
      let opts = [], seen = new Set([k]);
      for (const src of [pick(pool.filter(o => o.cat === c.cat && o.kind === c.kind && o.dir === c.dir)), pick(pool.filter(o => o.cat === c.cat)), pick(pool), pick(d.cards)]) {
        for (const o of src) { if (opts.length >= 3) break; if (!seen.has(key(o))) { seen.add(key(o)); opts.push(o.back); } }
      }
      const all = shuffle(opts.concat([c.back]));
      return { c, opts: all, right: all.indexOf(c.back), pick: -1 };
    });
    return { qs, i: 0, score: 0, finished: false };
  }
  function startTest(d, retake) {
    const cards = retake || shuffle(eligible(d).slice()).slice(0, S.settings.testSize);
    if (!cards.length) return;
    ui.test = makeTest(d, cards); renderView();
  }
  function testQ(d) {
    const t = ui.test, q = t.qs[t.i], c = q.c, answered = q.pick >= 0;
    const fs = sayFront(c);
    let h = '<div class="sess-top"><button class="linkish" data-act="quit-test">← End</button><div class="pbar"><i style="width:' + (t.i / t.qs.length * 100) + '%"></i></div><span class="mono" style="font-size:12px;color:var(--ink-3)">' + (t.i + 1) + " / " + t.qs.length + "</span></div>";
    h += '<section class="panel prompt"><div class="meta"><span class="label">' + esc(dirLabel(c)) + '</span><span class="label">' + esc(catLabel(d, c.cat)) + '</span></div><div class="' + (c.frontIt ? "it" : "en") + (plain(c.front).length > 34 ? " small" : "") + '">' + c.front + "</div>" + (fs ? sayBtn(fs) : "") + "</section>";
    h += '<div class="options">' + q.opts.map((o, i) => {
      const cls = answered ? (i === q.right ? " right" : i === q.pick ? " wrong" : "") : "";
      return '<button class="opt' + cls + '" data-pick="' + i + '"' + (answered ? " disabled" : "") + '><span class="kbd">' + (i + 1) + '</span><span class="ot ' + (c.backIt ? "it" : "en") + '">' + o + "</span></button>";
    }).join("") + "</div>";
    if (answered) {
      const bs = sayBack(c);
      h += '<div class="verdict ' + (q.pick === q.right ? "ok" : "no") + '">' + (q.pick === q.right ? "Corretto!" : "Not this time.") + "</div>";
      if (c.note || bs) h += '<div class="panel" style="gap:10px">' + (c.note ? '<div class="note" style="border:0;padding:0">' + c.note + "</div>" : "") + (bs ? sayBtn(bs) : "") + "</div>";
      h += '<button class="btn primary reveal" data-act="next">' + (t.i + 1 < t.qs.length ? "Next question" : "See results") + ' <span class="kbd">Enter</span></button>';
    }

  }
  function pickOpt(i) {
    const t = ui.test; if (!t || t.finished) return;

    q.pick = i; if (i === q.right) t.score++;
    renderView();
  }
  function nextQ() {
    const t = ui.test; if (!t || t.finished || t.qs[t.i].pick < 0) return;

    else { t.finished = true; S.tests.push({ deck: ui.deck, day: today(), score: t.score, total: t.qs.length }); S.tests = S.tests.slice(-200); save(); }
    renderView();
  }
  function testDone(d) {
    const t = ui.test, pct = t.score / t.qs.length, wrong = t.qs.filter(q => q.pick !== q.right);
    const R = 15, C = 2 * Math.PI * R;
    return '<section class="panel"><span class="label">Test complete</span><div class="score"><svg class="big-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="' + R + '" fill="none" stroke="var(--rule)" stroke-width="3"/><circle cx="20" cy="20" r="' + R + '" fill="none" stroke="' + (pct >= .8 ? "var(--sage)" : pct >= .5 ? "var(--amber)" : "var(--brick)") + '" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(2) + '" transform="rotate(-90 20 20)"/><text x="20" y="22.5" text-anchor="middle" style="font-size:9px">' + Math.round(pct * 100) + '%</text></svg>' +

  // ---------- Progress ----------
  function barChart(days, vals, todayIdx) {
    const W = 560, H = 150, padL = 26, padB = 20, max = Math.max(5, ...vals), bw = (W - padL) / days.length;
    const nice = [10, 20, 40, 60, 100, 160, 200, 300, 400].find(n => n >= max) || Math.ceil(max / 100) * 100;
    let s = '<svg class="chart" viewBox="0 0 ' + W + " " + (H + padB) + '" role="img" aria-label="Cards reviewed per day, last ' + days.length + ' days">';
    [0, .5, 1].forEach(f => { const y = H - f * (H - 10); s += '<line class="grid" x1="' + padL + '" x2="' + W + '" y1="' + y + '" y2="' + y + '"/><text x="0" y="' + (y + 3) + '">' + Math.round(nice * f) + "</text>"; });
    vals.forEach((v, i) => {
      const h = v / nice * (H - 10), x = padL + i * bw + bw * .18;
      if (v) s += '<rect class="bar' + (i === todayIdx ? " today" : "") + '" x="' + x.toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + (bw * .64).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"><title>' + dayShort(days[i]) + ": " + v + "</title></rect>";
      s += '<text x="' + (padL + i * bw + bw / 2).toFixed(1) + '" y="' + (H + 15) + '" text-anchor="middle">' + dayLabel(days[i]) + "</text>";
    });
    return s + "</svg>";
  }
  function lineChart(days, vals) {
    const W = 560, H = 140, padL = 34, padB = 20, bw = (W - padL) / days.length;

    let s = '<svg class="chart" viewBox="0 0 ' + W + " " + (H + padB) + '" role="img" aria-label="Share of review cards remembered per day">';
    [0, .5, 1].forEach(f => { const y = H - f * (H - 10); s += '<line class="grid" x1="' + padL + '" x2="' + W + '" y1="' + y + '" y2="' + y + '"/><text x="0" y="' + (y + 3) + '">' + Math.round(f * 100) + "%</text>"; });
    const p = pts.filter(Boolean);

      s += '<path class="area" d="M' + p[0][0] + "," + H + " " + p.map(q => "L" + q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ") + " L" + p[p.length - 1][0] + "," + H + 'Z"/>';
      s += '<path class="line" d="' + p.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ") + '"/>';

    days.forEach((dd, i) => { s += '<text x="' + (padL + i * bw + bw / 2).toFixed(1) + '" y="' + (H + 15) + '" text-anchor="middle">' + dayLabel(dd) + "</text>"; });
    return s + "</svg>";
  }
  function progress(d) {
    const c = counts(d), N = d.cards.length, t0 = today(), days = [];

    const per = days.map(x => ((S.log[x] || { decks: {} }).decks[d.id]) || { n: 0, rev: 0, ok: 0 });
    const reviews = per.map(p => p.n), ret = per.map(p => p.rev ? p.ok / p.rev : null);
    const totRev = per.reduce((a, p) => a + p.rev, 0), totOk = per.reduce((a, p) => a + p.ok, 0);
    const tests = S.tests.filter(t => t.deck === d.id).slice(-5).reverse();

      '<div class="kpi"><span class="label">Remembered</span><span class="n">' + (totRev ? Math.round(totOk / totRev * 100) + "%" : "–") + '</span><span class="hint">reviews, 14 days</span></div></div>' +
      '<section class="panel"><span class="label">Deck</span><div class="stack">' + seg.map(([k, col]) => '<i style="width:' + (c[k] / N * 100) + "%;background:" + col + '"></i>').join("") + '</div><div class="legend">' + seg.map(([k, col, l]) => '<span><i style="background:' + col + '"></i>' + l + " " + c[k] + "</span>").join("") + "</div></section>" +

      '<section class="panel"><span class="label">Recent tests</span>' + (tests.length ? '<div class="tests">' + tests.map(t => "<div><span>" + dayShort(t.day) + '</span><span class="mono">' + t.score + " / " + t.total + "</span></div>").join("") + "</div>" : '<p class="empty">No tests yet.</p>') + "</section>" +
      '<div class="row"><button class="linkish" data-act="reset">Reset progress for this deck</button><span id="reset-confirm" hidden><button class="btn" data-act="reset-yes" style="color:var(--brick)">Yes, reset ' + esc(plain(d.title)) + '</button> <button class="linkish" data-act="reset-no">Cancel</button></span></div>';
  }

  // ---------- Events ----------
  function openDrawer(on) { $("#side").classList.toggle("open", on); $("#scrim").hidden = !on; }

  document.addEventListener("click", e => {
    const t = e.target.closest("button, a, .card, #scrim");
    if (!t) return;
    const d = deckById(ui.deck);
    if (t.matches(".say")) { e.stopPropagation(); speak(t.dataset.say); return; }
    if (t.id === "card") { flip(); return; }
    if (t.id === "scrim") { openDrawer(false); closeHelp(); return; }
    if (t.dataset.deck) { setDeck(t.dataset.deck); openDrawer(false); window.scrollTo(0, 0); return; }

    if (t.dataset.rate) { rate(+t.dataset.rate); return; }
    if (t.dataset.pick) { pickOpt(+t.dataset.pick); return; }
    if (t.dataset.cat) { const cur = selectedCats(d); cur.has(t.dataset.cat) ? cur.delete(t.dataset.cat) : cur.add(t.dataset.cat); if (!cur.size) cur.add(t.dataset.cat); S.settings.cats[d.id] = [...cur]; S.settings.optsOpen = true; save(); render(); return; }
    if (t.hasAttribute("data-allcats")) { delete S.settings.cats[d.id]; S.settings.optsOpen = true; save(); render(); return; }
    if (t.hasAttribute("data-onecat")) { S.settings.cats[d.id] = [d.cats[0][0]]; S.settings.optsOpen = true; save(); render(); return; }
    if (t.dataset.dir) { S.settings.dir = t.dataset.dir; S.settings.optsOpen = true; save(); render(); return; }
    if (t.dataset.npd) { S.settings.newPerDay = +t.dataset.npd; S.settings.optsOpen = true; save(); render(); return; }
    if (t.dataset.tsize) { S.settings.testSize = +t.dataset.tsize; S.settings.optsOpen = true; save(); render(); return; }
    const a = t.dataset.act;
    if (a === "menu") openDrawer(true);
    else if (a === "help") openHelp();
    else if (a === "close-help") closeHelp();
    else if (a === "theme") { const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); S.settings.theme = cur === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", S.settings.theme); save(); }
    else if (a === "start") startSession(d, false);
    else if (a === "extra") startSession(d, true);
    else if (a === "flip") flip();
    else if (a === "quit" || a === "home") { ui.sess = null; ui.flipped = false; renderView(); }
    else if (a === "test") startTest(d);
    else if (a === "retake") startTest(d, ui.test.qs.filter(q => q.pick !== q.right).map(q => q.c));
    else if (a === "next") nextQ();
    else if (a === "quit-test") { ui.test = null; renderView(); }
    else if (a === "reset") $("#reset-confirm").hidden = false;
    else if (a === "reset-no") $("#reset-confirm").hidden = true;
    else if (a === "reset-yes") { delete S.cards[d.id]; Object.values(S.log).forEach(L => { const x = L.decks[d.id]; if (x) { L.n -= x.n; L.rev -= x.rev; L.ok -= x.ok; L.nw -= x.nw; delete L.decks[d.id]; } }); S.tests = S.tests.filter(t2 => t2.deck !== d.id); save(); render(); }
  });
  document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details.opts")) { S.settings.optsOpen = e.target.open; save(); } }, true);
  document.addEventListener("change", e => { if (e.target.id === "typing") { S.settings.typing = e.target.checked; save(); } });
  document.addEventListener("submit", e => {
    if (e.target.id !== "typeform") return;
    e.preventDefault();
    const v = $("#answer").value; const c = ui.sess && ui.sess.q[0];
    if (c && v.trim()) ui.verdict = check(c, v);
    $("#answer").blur(); flip();
  });
  function openHelp() { $("#help").hidden = false; $("#scrim").hidden = false; $("#help button").focus(); }
  function closeHelp() { $("#help").hidden = true; if (!$("#side").classList.contains("open")) $("#scrim").hidden = true; }
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (e.key === "Escape") { closeHelp(); openDrawer(false); return; }
    if (e.key === "?") { e.preventDefault(); $("#help").hidden ? openHelp() : closeHelp(); return; }
    if (!$("#help").hidden) return;
    if (e.key === "a" || e.key === "A") { const vis = [...document.querySelectorAll(".say")].filter(x => x.offsetParent !== null); const pick = ui.mode === "study" && ui.sess && !ui.sess.done ? $(ui.flipped ? ".face.back .say" : ".face.front .say") : vis[vis.length - 1] || null; if (pick) speak(pick.dataset.say); return; }
    if (ui.mode === "study") {
      if (ui.sess && !ui.sess.done) {
        if (e.key === " " || (e.key === "Enter" && !ui.flipped)) { if (tag === "button" && e.key === "Enter") return; e.preventDefault(); flip(); }
        else if (ui.flipped && /^[1-4]$/.test(e.key)) { e.preventDefault(); rate(+e.key); }
      } else if (e.key === "Enter" && tag !== "button") {
        e.preventDefault();
        if (ui.sess && ui.sess.done) { ui.sess = null; renderView(); } else { const s = $('[data-act="start"]'); if (s) s.click(); }
      }
    } else if (ui.mode === "test") {
      if (ui.test && !ui.test.finished) {
        if (/^[1-4]$/.test(e.key)) { e.preventDefault(); pickOpt(+e.key - 1); }
        else if ((e.key === "Enter" || e.key === " ") && tag !== "button") { e.preventDefault(); nextQ(); }
      } else if (e.key === "Enter" && tag !== "button") { e.preventDefault(); const b = $('[data-act="retake"]') || $('[data-act="test"]'); if (b) b.click(); }
    }
  });
  window.addEventListener("hashchange", () => { const id = routeDeck(); if (id !== ui.deck) setDeck(id); });

  setDeck(routeDeck());
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
})();

</script>
