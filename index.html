/* Paper & Ink. Layout: a quiet sidebar of decks beside one study column; on phones the sidebar becomes a drawer. */
:root {
  --paper: #FBFBF9;
  --surface: #FFFFFF;
  --sunk: #F3F2EE;
  --rule: #E5E2DB;
  --rule-strong: #CFCBC2;
  --ink: #1C1C1E;
  --ink-2: #57575C;
  --ink-3: #8C8B88;
  --sage: #4F7F5C;
  --sage-soft: #E4EDE5;
  --amber: #A86A12;
  --amber-soft: #F5EAD6;
  --brick: #AD4A2B;
  --brick-soft: #F4E2DB;
  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 0 rgba(28,28,30,.04), 0 14px 32px -18px rgba(28,28,30,.28);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151514; --surface: #1C1C1B; --sunk: #191918; --rule: #2E2D2A; --rule-strong: #45433F;
    --ink: #ECEAE4; --ink-2: #ABA9A2; --ink-3: #7A7873;
    --sage: #8FBB9A; --sage-soft: #1F2B22; --amber: #E2AA55; --amber-soft: #2E2416; --brick: #E38D6D; --brick-soft: #33201A;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 32px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151514; --surface: #1C1C1B; --sunk: #191918; --rule: #2E2D2A; --rule-strong: #45433F;
  --ink: #ECEAE4; --ink-2: #ABA9A2; --ink-3: #7A7873;
  --sage: #8FBB9A; --sage-soft: #1F2B22; --amber: #E2AA55; --amber-soft: #2E2416; --brick: #E38D6D; --brick-soft: #33201A;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 32px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }
.side { border-right: 1px solid var(--rule); padding: 28px 18px 24px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--paper); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-inline: 6px; }
.brand h1 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0; letter-spacing: -.01em; }
.streak { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.streak svg { width: 12px; height: 12px; }
.streak.on { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, var(--rule)); }
.decks { display: grid; gap: 4px; }
.deck-btn { appearance: none; border: 1px solid transparent; background: none; text-align: left; padding: 10px; border-radius: 10px; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; cursor: pointer; }
.deck-btn:hover { background: var(--sunk); }
.deck-btn[aria-current="true"] { background: var(--surface); border-color: var(--rule); box-shadow: var(--shadow); }
.deck-btn .t { font-family: var(--serif); font-size: 18px; line-height: 1.2; display: block; }
.deck-btn .e { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.due { font-family: var(--mono); font-size: 11px; color: var(--amber); background: var(--amber-soft); border-radius: 999px; padding: 1px 8px; }
.due.zero { color: var(--ink-3); background: none; }
.ring { width: 40px; height: 40px; display: block; }
.ring .bg { stroke: var(--rule); }
.ring .fg { stroke: var(--sage); transition: stroke-dashoffset .5s ease; }
.ring text { font-family: var(--mono); font-size: 10px; fill: var(--ink-2); }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding-inline: 6px; }
.linkish { appearance: none; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.linkish:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--rule-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--ink-2); background: var(--surface); white-space: nowrap; }

.topbar { display: none; }
.main { min-width: 0; padding: 40px 32px 80px; }
#view { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.col { max-width: 720px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
.deck-head { display: grid; gap: 6px; }
.deck-head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(32px, 5vw, 46px); line-height: 1.05; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.deck-head p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 14px; cursor: pointer; color: var(--ink-3); font-weight: 600; font-size: 15px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* ---------- Panels & controls ---------- */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 22px; display: grid; gap: 18px; }
.today { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.stat { display: grid; gap: 2px; }
.stat .n { font-family: var(--serif); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .n.amber { color: var(--amber); } .stat .n.sage { color: var(--sage); }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.btn { appearance: none; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 10px; align-items: center; justify-content: center; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary .kbd { background: transparent; color: var(--paper); border-color: color-mix(in srgb, var(--paper) 45%, transparent); }
.btn:disabled { opacity: .4; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--surface); padding: 7px 12px; font-size: 14px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13.5px; cursor: pointer; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: baseline; }
.chip .c { font-family: var(--mono); font-size: 11px; }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--sunk); }
details.opts { display: block; }
details.opts > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; }
details.opts > summary::-webkit-details-marker { display: none; }
details.opts > summary::before { content: "+"; font-family: var(--mono); color: var(--ink-3); width: 1ch; }
details.opts[open] > summary::before { content: "−"; }
details.opts > summary .label { margin-left: auto; text-transform: none; letter-spacing: 0; }
.opts-body { display: grid; gap: 14px; margin-top: 16px; }
.opt-line { display: grid; gap: 6px; }
.toggle { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.toggle input { accent-color: var(--ink); width: 16px; height: 16px; }

/* ---------- Session ---------- */
.sess-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pbar { flex: 1; height: 4px; background: var(--rule); border-radius: 99px; overflow: hidden; display: flex; }
.pbar i { display: block; height: 100%; background: var(--ink); transition: width .3s ease; }
.pbar i.again { background: var(--brick); }
.stage { perspective: 1600px; }
.card { position: relative; cursor: pointer; outline: none; }
.card-inner { display: grid; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.75,.2,1); }
.card.flipped .card-inner { transform: rotateY(180deg); }
.face { grid-area: 1/1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); padding: 26px 28px 22px; min-height: 300px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.face.back { transform: rotateY(180deg); }
.card:focus-visible .face { outline: 2px solid var(--ink); outline-offset: 3px; }
.meta { display: flex; justify-content: space-between; gap: 10px; }
.meta .label:first-child { color: var(--ink-2); }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-width: 0; }
.it { font-family: var(--serif); font-size: clamp(28px, 6vw, 40px); line-height: 1.18; overflow-wrap: anywhere; letter-spacing: -.005em; }
.en { font-family: var(--sans); font-weight: 600; font-size: clamp(21px, 4.4vw, 27px); line-height: 1.3; overflow-wrap: anywhere; }
.it.small { font-size: clamp(21px, 4.4vw, 28px); } .en.small { font-size: clamp(18px, 3.8vw, 22px); }
.hint { font-size: 14px; color: var(--ink-3); }
.note { font-size: 15px; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 12px; max-width: 62ch; }
.note b { color: var(--ink); }
.st { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--amber); }
.say { appearance: none; align-self: flex-start; justify-self: start; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 999px; font-size: 13px; padding: 4px 12px 4px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.say:hover { color: var(--ink); border-color: var(--ink-3); }
.say svg { width: 14px; height: 14px; }
.typebox { display: flex; gap: 8px; }
.typebox input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 11px 14px; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--surface); color: var(--ink); }
.verdict { font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 8px; }
.verdict.ok { background: var(--sage-soft); color: var(--sage); }
.verdict.close { background: var(--amber-soft); color: var(--amber); }
.verdict.no { background: var(--brick-soft); color: var(--brick); }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.rate button { appearance: none; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 12px; padding: 10px 6px 9px; cursor: pointer; display: grid; gap: 2px; justify-items: center; }
.rate button .w { font-weight: 600; font-size: 15px; }
.rate button .i { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.rate .r1 .w { color: var(--brick); } .rate .r2 .w { color: var(--amber); } .rate .r4 .w { color: var(--sage); }
.rate .r1:hover { background: var(--brick-soft); border-color: var(--brick); }
.rate .r2:hover { background: var(--amber-soft); border-color: var(--amber); }
.rate .r3:hover { background: var(--sunk); border-color: var(--ink); }
.rate .r4:hover { background: var(--sage-soft); border-color: var(--sage); }
.reveal { width: 100%; padding: 14px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 12px; color: var(--ink-3); }
.keys span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- Test ---------- */
.options { display: grid; gap: 8px; }
.opt { appearance: none; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: center; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt .kbd { justify-self: start; }
.opt .ot.it { font-size: 21px; } .opt .ot.en { font-size: 16px; }
.opt.right { border-color: var(--sage); background: var(--sage-soft); }
.opt.wrong { border-color: var(--brick); background: var(--brick-soft); }
.opt:disabled { cursor: default; }
.prompt { display: grid; gap: 10px; }
.score { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.big-ring { width: 120px; height: 120px; }
.big-ring text { font-family: var(--serif); font-size: 26px; fill: var(--ink); }
.mist { display: grid; gap: 8px; }
.mist div { border-top: 1px solid var(--rule); padding-top: 8px; display: grid; gap: 2px; }
.mist .q { font-size: 14px; color: var(--ink-2); }
.mist .a.it-a { font-family: var(--serif); font-size: 19px; }
.mist .a.en-a { font-weight: 600; font-size: 16px; }
.mist .y { font-size: 13px; color: var(--brick); }

/* ---------- Progress ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.kpi .n { font-family: var(--serif); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--rule); }
.stack i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 10px; fill: var(--ink-3); }
.chart .grid { stroke: var(--rule); }
.chart .bar { fill: var(--ink); }
.chart .bar.today { fill: var(--amber); }
.chart .line { stroke: var(--sage); fill: none; stroke-width: 2; }
.chart .area { fill: var(--sage-soft); }
.chart .dot { fill: var(--sage); }
.empty { color: var(--ink-3); font-size: 14px; margin: 0; }
.tests { display: grid; gap: 6px; font-size: 14px; }
.tests div { display: flex; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 6px; }

/* ---------- Notes (the lesson notes reuse these names) ---------- */
.notes { display: grid; gap: 30px; grid-template-columns: minmax(0,1fr); }
.notes section { display: grid; gap: 12px; grid-template-columns: minmax(0,1fr); }
.notes h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0; }
.notes p { margin: 0; max-width: 65ch; }
.notes ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; max-width: 65ch; }
.notes .src { font-size: 13px; color: var(--ink-3); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
.notes table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.notes th, .notes td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.notes tr:last-child td { border-bottom: 0; }
.notes th { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 400; }
.notes td.it-cell { font-family: var(--serif); font-size: 19px; }
.notes table.glance td.it-cell { font-size: 23px; text-align: center; }
.notes table.glance th { text-align: center; } .notes table.glance th:first-child { text-align: left; }
.plaque { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--rule); background: var(--surface); border-radius: 12px; overflow: hidden; max-width: 100%; justify-self: start; }
.plaque div { padding: 10px 16px; display: grid; gap: 2px; text-align: center; }
.plaque div + div { border-left: 1px dashed var(--rule-strong); }
.plaque .w { font-family: var(--serif); font-size: 24px; }
.plaque .l { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.grid-cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.cell { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; display: grid; }
.cell .k { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.cell .v { font-family: var(--serif); font-size: 20px; }
.cell.extra { border-style: dashed; }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20,20,18,.38); z-index: 30; }
.modal { position: fixed; z-index: 40; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(440px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 14px; }
.modal h3 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0; }
.modal dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 0; align-items: center; }
.modal dt { justify-self: start; display: flex; gap: 4px; }
.modal dd { margin: 0; color: var(--ink-2); font-size: 15px; }

/* ---------- Phones ---------- */
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .side { position: fixed; z-index: 35; inset: 0 auto 0 0; width: min(300px, 86vw); height: 100%; transform: translateX(-102%); transition: transform .25s ease; box-shadow: var(--shadow); padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
  .side.open { transform: none; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 20; align-items: center; gap: 10px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
  .topbar .menu { appearance: none; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; flex: none; }
  .topbar .menu svg { width: 18px; height: 18px; }
  .topbar .tt { font-family: var(--serif); font-size: 19px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main { padding: 20px 16px 64px; }
  .face { padding: 22px 20px 18px; min-height: 270px; }
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat .n { font-size: 32px; }
  .keys { display: none; }
}
@media (hover: none) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .card-inner, .side, .pbar i, .ring .fg { transition: none; } }

r": "it-en", "kind": null, "front": "il limone", "back": "lemon", "frontIt": true, "backIt": false, "note": null, "say": "il limone", "accept": null, "strict": false}, {"id": "efafee6f2f", "cat": "scorsa", "dir": "en-it", "kind": null, "front": "lemon", "back": "il limone", "frontIt": false, "backIt": true, "note": null, "say": "il limone", "accept": null, "strict": false}, {"id": "5c74056f0d", "cat": "scorsa", "dir": "it-en", "kind": null, "front": "la bicicletta", "back": "bicycle", "frontIt": true, "backIt": false, "note": "Double T.", "say": "la bicicletta", "accept": null, "strict": false}, {"id": "8a295d9b88", "cat": "scorsa", "dir": "en-it", "kind": null, "front": "bicycle", "back": "la bicicletta", "frontIt": false, "backIt": true, "note": "Double T.", "say": "la bicicletta", "accept": null, "strict": false}, {"id": "7f2a9ca2d4", "cat": "scorsa", "dir": "it-en", "kind": null, "front": "gli amici", "back": "friends", "frontIt": true, "backIt": false, "note": null, "say": "gli amici", "accept": null, "strict": false}, {"id": "ff310eae3c", "cat": "scorsa", "dir": "en-it", "kind": null, "front": "friends", "back": "gli amici", "frontIt": false, "backIt": true, "note": null, "say": "gli amici", "accept": null, "strict": false}], "notes": "<section>\n      <h2>Saying where you live<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th><\/th><th>Informal (tu)<\/th><th>Formal (Lei)<\/th><\/tr>\n        <tr><td>Name<\/td><td class=\"it-cell\">Come ti chiami?<\/td><td class=\"it-cell\">Come si chiama?<\/td><\/tr>\n        <tr><td>Spelling<\/td><td class=\"it-cell\">Come si scrive?<\/td><td class=\"it-cell\">Come si scrive?<\/td><\/tr>\n        <tr><td>Town<\/td><td class=\"it-cell\">Dove abit<span class=\"st\">i<\/span>?<\/td><td class=\"it-cell\">Dove abit<span class=\"st\">a<\/span>?<\/td><\/tr>\n        <tr><td>Exactly where<\/td><td class=\"it-cell\">Dove di preciso?<\/td><td class=\"it-cell\">Dove di preciso?<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>Towns take <b>a<\/b>, not <i>in<\/i>: <i>Abito <b>a<\/b> Oxford<\/i>, <i>Abito <b>a<\/b> Londra<\/i>. Countries take <i>in<\/i>: <i>Abito in Inghilterra<\/i>.<\/li>\n        <li>Big place first, then the detail: town, then street.<\/li>\n        <li>The formal “you” uses the same form as “he/she”: <i>Lei abita<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>An Italian address<\/h2>\n      <div class=\"plaque\" aria-label=\"Via Fiore 12\">\n        <div><span class=\"w\">Via<\/span><span class=\"l\">type (optional)<\/span><\/div>\n        <div><span class=\"w\">Fiore<\/span><span class=\"l\">name<\/span><\/div>\n        <div><span class=\"w\">12<\/span><span class=\"l\">number last<\/span><\/div>\n      <\/div>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Italian<\/th><th>English<\/th><th>Notes<\/th><\/tr>\n        <tr><td class=\"it-cell\">la via<\/td><td>street, road<\/td><td>The everyday word<\/td><\/tr>\n        <tr><td class=\"it-cell\">il viale<\/td><td>boulevard<\/td><td>Wide, often tree-lined<\/td><\/tr>\n        <tr><td class=\"it-cell\">il corso<\/td><td>avenue<\/td><td>Also means “a course”<\/td><\/tr>\n        <tr><td class=\"it-cell\">la piazza<\/td><td>square<\/td><td><\/td><\/tr>\n        <tr><td class=\"it-cell\">il piazzale<\/td><td>large square, open plaza<\/td><td>Usually bigger than a piazza, but not always<\/td><\/tr>\n        <tr><td class=\"it-cell\">la calle<\/td><td>street<\/td><td>Venice only<\/td><\/tr>\n      <\/table><\/div>\n      <p class=\"src\">In the UK you still give your address as it's written in English. Don't Italianise it.<\/p>\n    <\/section>\n\n    <section>\n      <h2>Abitare (to live)<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Person<\/th><th>Italian<\/th><th>English<\/th><th>Ending<\/th><\/tr>\n        <tr><td>io<\/td><td class=\"it-cell\"><span class=\"st\">a<\/span>bito<\/td><td>I live<\/td><td>-o<\/td><\/tr>\n        <tr><td>tu<\/td><td class=\"it-cell\"><span class=\"st\">a<\/span>biti<\/td><td>you live (informal)<\/td><td>-i<\/td><\/tr>\n        <tr><td>lui / lei / Lei<\/td><td class=\"it-cell\"><span class=\"st\">a<\/span>bita<\/td><td>he / she lives; you live (formal)<\/td><td>-a<\/td><\/tr>\n        <tr><td>noi<\/td><td class=\"it-cell\">abiti<span class=\"st\">a<\/span>mo<\/td><td>we live<\/td><td>-iamo<\/td><\/tr>\n        <tr><td>voi<\/td><td class=\"it-cell\">abit<span class=\"st\">a<\/span>te<\/td><td>you all live<\/td><td>-ate<\/td><\/tr>\n        <tr><td>loro<\/td><td class=\"it-cell\"><span class=\"st\">a<\/span>bitano<\/td><td>they live<\/td><td>-ano<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>The underlined vowel carries the stress. It jumps forward for <i>noi<\/i> and <i>voi<\/i>, then back to the start for <i>loro<\/i>.<\/li>\n        <li>Italian usually drops <i>io, tu, noi<\/i>. The ending tells you who, so get that last letter right.<\/li>\n        <li>Every regular -are verb uses the same endings: <i>parlo, parli, parla, parliamo, parlate, parlano<\/i>.<\/li>\n        <li>For this lesson, focus on the first three (abito, abiti, abita). Those are the ones you use in conversation.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Numbers 0–12<\/h2>\n      <div class=\"grid-cells\"><div class=\"cell\"><span class=\"k\">0<\/span><span class=\"v\">zero<\/span><\/div><div class=\"cell\"><span class=\"k\">1<\/span><span class=\"v\">uno<\/span><\/div><div class=\"cell\"><span class=\"k\">2<\/span><span class=\"v\">due<\/span><\/div><div class=\"cell\"><span class=\"k\">3<\/span><span class=\"v\">tre<\/span><\/div><div class=\"cell\"><span class=\"k\">4<\/span><span class=\"v\">quattro<\/span><\/div><div class=\"cell\"><span class=\"k\">5<\/span><span class=\"v\">cinque<\/span><\/div><div class=\"cell\"><span class=\"k\">6<\/span><span class=\"v\">sei<\/span><\/div><div class=\"cell\"><span class=\"k\">7<\/span><span class=\"v\">sette<\/span><\/div><div class=\"cell\"><span class=\"k\">8<\/span><span class=\"v\">otto<\/span><\/div><div class=\"cell\"><span class=\"k\">9<\/span><span class=\"v\">nove<\/span><\/div><div class=\"cell\"><span class=\"k\">10<\/span><span class=\"v\">dieci<\/span><\/div><div class=\"cell\"><span class=\"k\">11<\/span><span class=\"v\">undici<\/span><\/div><div class=\"cell\"><span class=\"k\">12<\/span><span class=\"v\">dodici<\/span><\/div><\/div>\n      <ul>\n        <li><i>dieci<\/i> has <b>ie<\/b>, but <i>undici<\/i> and <i>dodici<\/i> only have <b>i<\/b>.<\/li>\n        <li><i>sette<\/i> and <i>otto<\/i> have a double T. Hold it: <i>set-te<\/i>, <i>ot-to<\/i>.<\/li>\n        <li>Italian is phonetic. If you know the sound, you can spell it.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>The alphabet<\/h2>\n      <p>21 letters. The five dashed ones only appear in foreign words.<\/p>\n      <div class=\"grid-cells\"><div class=\"cell\"><span class=\"k\">A<\/span><span class=\"v\">a<\/span><\/div><div class=\"cell\"><span class=\"k\">B<\/span><span class=\"v\">bi<\/span><\/div><div class=\"cell\"><span class=\"k\">C<\/span><span class=\"v\">ci<\/span><\/div><div class=\"cell\"><span class=\"k\">D<\/span><span class=\"v\">di<\/span><\/div><div class=\"cell\"><span class=\"k\">E<\/span><span class=\"v\">e<\/span><\/div><div class=\"cell\"><span class=\"k\">F<\/span><span class=\"v\">effe<\/span><\/div><div class=\"cell\"><span class=\"k\">G<\/span><span class=\"v\">gi<\/span><\/div><div class=\"cell\"><span class=\"k\">H<\/span><span class=\"v\">acca<\/span><\/div><div class=\"cell\"><span class=\"k\">I<\/span><span class=\"v\">i<\/span><\/div><div class=\"cell\"><span class=\"k\">L<\/span><span class=\"v\">elle<\/span><\/div><div class=\"cell\"><span class=\"k\">M<\/span><span class=\"v\">emme<\/span><\/div><div class=\"cell\"><span class=\"k\">N<\/span><span class=\"v\">enne<\/span><\/div><div class=\"cell\"><span class=\"k\">O<\/span><span class=\"v\">o<\/span><\/div><div class=\"cell\"><span class=\"k\">P<\/span><span class=\"v\">pi<\/span><\/div><div class=\"cell\"><span class=\"k\">Q<\/span><span class=\"v\">cu<\/span><\/div><div class=\"cell\"><span class=\"k\">R<\/span><span class=\"v\">erre<\/span><\/div><div class=\"cell\"><span class=\"k\">S<\/span><span class=\"v\">esse<\/span><\/div><div class=\"cell\"><span class=\"k\">T<\/span><span class=\"v\">ti<\/span><\/div><div class=\"cell\"><span class=\"k\">U<\/span><span class=\"v\">u<\/span><\/div><div class=\"cell\"><span class=\"k\">V<\/span><span class=\"v\">vu<\/span><\/div><div class=\"cell\"><span class=\"k\">Z<\/span><span class=\"v\">zeta<\/span><\/div><div class=\"cell extra\"><span class=\"k\">J<\/span><span class=\"v\">i lunga<\/span><\/div><div class=\"cell extra\"><span class=\"k\">K<\/span><span class=\"v\">cappa<\/span><\/div><div class=\"cell extra\"><span class=\"k\">W<\/span><span class=\"v\">doppia vu<\/span><\/div><div class=\"cell extra\"><span class=\"k\">X<\/span><span class=\"v\">ics<\/span><\/div><div class=\"cell extra\"><span class=\"k\">Y<\/span><span class=\"v\">ipsilon<\/span><\/div><\/div>\n      <ul>\n        <li>The vowels trip up English speakers: <b>E<\/b> sounds like “eh”, <b>I<\/b> sounds like “ee”. Mixing these two up is the most common mistake.<\/li>\n        <li>For a double letter, say <i>doppia<\/i>: otto = o, doppia ti, o.<\/li>\n        <li>Move your lips and articulate. Italian is spoken from the front of the mouth.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Street-name words<\/h2>\n      <p>The teacher picked real street names because these words come back in later lessons.<\/p>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Italian<\/th><th>English<\/th><\/tr>\n        <tr><td class=\"it-cell\">il fiore<\/td><td>flower (also a surname)<\/td><\/tr>\n        <tr><td class=\"it-cell\">la scarpetta<\/td><td>little shoe. <i>Fare la scarpetta<\/i>: mop up the sauce with bread<\/td><\/tr>\n        <tr><td class=\"it-cel , "strict": true}, {"id": "4d799a5728", "cat": "articoli", "dir": "drill", "kind": "Article", "front": "___ panino (a / an)", "back": "un", "frontIt": true, "backIt": true, "note": "Masculine, consonant. <i>un panino<\/i>", "say": "un panino", "accept": null, "strict": true}, {"id": "6045358167", "cat": "articoli", "dir": "drill", "kind": "Article", "front": "___ birra (a / an)", "back": "una", "frontIt": true, "backIt": true, "note": "Feminine, consonant. <i>una birra<\/i>", "say": "una birra", "accept": null, "strict": true}, {"id": "69ef992235", "cat": "articoli", "dir": "drill", "kind": "Article", "front": "___ Coca-Cola (a / an)", "back": "una", "frontIt": true, "backIt": true, "note": "Feminine, consonant. <i>una Coca-Cola<\/i>", "say": "una Coca-Cola", "accept": null, "strict": true}, {"id": "d899823a22", "cat": "articoli", "dir": "drill", "kind": "Article", "front": "___ patatina (a / an)", "back": "una", "frontIt": true, "backIt": true, "note": "Feminine, consonant. Plural: <i>patatine<\/i>. <i>una patatina<\/i>", "say": "una patatina", "accept": null, "strict": true}, {"id": "219d6e9cec", "cat": "articoli", "dir": "drill", "kind": "Article", "front": "___ aranciata (a / an)", "back": "un'", "frontIt": true, "backIt": true, "note": "Feminine, vowel: <i>una<\/i> loses its A. <i>un'aranciata<\/i>", "say": "un'aranciata", "accept": null, "strict": true}, {"id": "f70032588a", "cat": "articoli", "dir": "drill", "kind": "Article", "front": "___ acqua minerale (a / an)", "back": "un'", "frontIt": true, "backIt": true, "note": "Feminine, vowel: <i>una<\/i> loses its A. <i>un'acqua minerale<\/i>", "say": "un'acqua minerale", "accept": null, "strict": true}, {"id": "013fb6a594", "cat": "articoli", "dir": "drill", "kind": "Rule", "front": "Which word for “a” goes with masculine nouns?", "back": "un", "frontIt": false, "backIt": true, "note": "<i>un caffè, un gelato<\/i>", "say": "un", "accept": null, "strict": false}, {"id": "424a4a693e", "cat": "articoli", "dir": "drill", "kind": "Rule", "front": "Which word for “a” goes with feminine nouns starting with a consonant?", "back": "una", "frontIt": false, "backIt": true, "note": "<i>una birra<\/i>", "say": "una", "accept": null, "strict": false}, {"id": "e7697d9c49", "cat": "articoli", "dir": "drill", "kind": "Rule", "front": "Which word for “a” goes with feminine nouns starting with a vowel?", "back": "un'", "frontIt": false, "backIt": true, "note": "<i>un'aranciata, un'acqua<\/i>", "say": "un'", "accept": null, "strict": false}, {"id": "189c1f019f", "cat": "articoli", "dir": "drill", "kind": "Rule", "front": "Why <i>un'aranciata<\/i> and not <i>una aranciata<\/i>?", "back": "Two vowels clash, so the A of <i>una<\/i> drops and an apostrophe marks the gap.", "frontIt": false, "backIt": false, "note": "Italian links words in speech, and the spelling shows it. Spanish keeps <i>una<\/i>.", "say": null, "accept": null, "strict": false}, {"id": "0b778d2392", "cat": "articoli", "dir": "drill", "kind": "Rule", "front": "Does a masculine noun starting with a vowel need an apostrophe?", "back": "No. <i>Un<\/i> already ends in a consonant.", "frontIt": false, "backIt": false, "note": "The apostrophe only appears with feminine <i>un'<\/i>.", "say": null, "accept": null, "strict": false}, {"id": "2c6988745e", "cat": "articoli", "dir": "drill", "kind": "Term", "front": "What's the grammar name for “a / an” (<i>un, una, un'<\/i>)?", "back": "The indefinite article", "frontIt": false, "backIt": false, "note": null, "say": null, "accept": null, "strict": false}, {"id": "6ebaf50e1d", "cat": "articoli", "dir": "drill", "kind": "Coming up", "front": "Is there a fourth word for “a”?", "back": "Yes: <i>uno<\/i>. It's next week's lesson.", "frontIt": false, "backIt": false, "note": "Used before masculine nouns starting with s + consonant or z: <i>uno spumante, uno zaino<\/i>.", "say": null, "accept": null, "strict": false}, {"id": "7f27c38278", "cat": "genere", "dir": "drill", "kind": "M or F", "front": ct": false}, {"id": "37046a485f", "cat": "genere", "dir": "drill", "kind": "Spot it", "front": "<i>Patatine<\/i>: singular or plural?", "back": "Plural. The singular is <i>patatina<\/i>.", "frontIt": false, "backIt": false, "note": null, "say": null, "accept": null, "strict": false}, {"id": "5f3e47672f", "cat": "genere", "dir": "drill", "kind": "Spot it", "front": "In <i>un'acqua minerale<\/i>, what type of word is <i>minerale<\/i>?", "back": "An adjective. It agrees with <i>acqua<\/i>.", "frontIt": false, "backIt": false, "note": "Adjectives agree with the noun in gender and number. More on this later.", "say": null, "accept": null, "strict": false}, {"id": "72964384f4", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>ci<\/i> and <i>ce<\/i> sound like…", "back": "a soft “ch”, as in church", "frontIt": false, "backIt": false, "note": "<i>cappuccino, aranciata<\/i>", "say": null, "accept": null, "strict": false}, {"id": "c4f61bc496", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>chi<\/i> and <i>che<\/i> sound like…", "back": "a hard “k”, as in key", "frontIt": false, "backIt": false, "note": "<i>pacchetto<\/i>", "say": null, "accept": null, "strict": false}, {"id": "dc6b45230f", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>gi<\/i> and <i>ge<\/i> sound like…", "back": "a soft “j”, as in jet", "frontIt": false, "backIt": false, "note": "<i>gelato<\/i>", "say": null, "accept": null, "strict": false}, {"id": "c3000c022a", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>ghi<\/i> and <i>ghe<\/i> sound like…", "back": "a hard “g”, as in get", "frontIt": false, "backIt": false, "note": "<i>ghiaccio<\/i> (ice)", "say": null, "accept": null, "strict": false}, {"id": "cd764392a3", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>ca, co, cu<\/i> sound like…", "back": "a hard “k”", "frontIt": false, "backIt": false, "note": "<i>caffè, cornetto, succo<\/i>", "say": null, "accept": null, "strict": false}, {"i d for both. Only the article changes.", "say": "il / la barista", "accept": null, "strict": false}, {"id": "79216799f5", "cat": "classe", "dir": "en-it", "kind": null, "front": "the barman / barmaid", "back": "il / la barista", "frontIt": false, "backIt": true, "note": "Same word for both. Only the article changes.", "say": "il / la barista", "accept": null, "strict": false}, {"id": "4127e1a11c", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a coffee and a croissant, please.", "back": "Un caffè e un cornetto, per favore.", "frontIt": false, "backIt": true, "note": null, "say": "Un caffè e un cornetto, per favore.", "accept": ["Un caffè e un cornetto.", "Un caffè e un cornetto per favore"], "strict": false}, {"id": "aef1b36c0e", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order an orange juice and an ice cream, please.", "back": "Un succo d'arancia e un gelato, per favore.", "frontIt": false, "backIt": true, "note": null, "say": "Un succo d'arancia e un gelato, per favore.", "accept": ["Un succo d'arancia e un gelato.", "Un succo d'arancia e un gelato per favore"], "strict": false}, {"id": "6bb9275c84", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a beer and a wine, please.", "back": "Una birra e un vino, per favore.", "frontIt": false, "backIt": true, "note": null, "say": "Una birra e un vino, per favore.", "accept": ["Una birra e un vino.", "Una birra e un vino per favore"], "strict": false}, {"id": "32a0a54b29", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order an ice cream and a tea, please.", "back": "Un gelato e un tè, per favore.", "frontIt": false, "backIt": true, "note": null, "say": "Un gelato e un tè, per favore.", "accept": ["Un gelato e un tè.", "Un gelato e un tè per favore"], "strict": false}, {"id": "dc4c4f0be4", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a packet of crisps and a beer, please.", "back": "Un pacchetto di patatine e una birra, per favore.", "frontIt": false, "backIt": true, "note": null, "say": "Un pacchetto di patatine e una birra, per favore.", "accept": ["Un pacchetto di patatine e una birra.", "Un pacchetto di patatine e una birra per favore"], "strict": false}, {"id": "00d3fa74a3", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order an orangeade and a Coke, please.", "back": "Un'aranciata e una Coca-Cola, per favore.", "frontIt": false, "backIt": true, "note": null, "say": "Un'aranciata e una Coca-Cola, per favore.", "accept": ["Un'aranciata e una Coca-Cola.", "Un'aranciata e una Coca-Cola per favore"], "strict": false}, {"id": "99a3795192", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a wine and a Martini, please.", "back": "Un vino e un Martini, per favore.", "frontIt": false, "backIt": true, "note": null, "say": "Un vino e un Martini, per favore.", "accept": ["Un vino e un Martini.", "Un vino e un Martini per favore"], "strict": false}, {"id": "9d84aeeae3", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order an ice cream and a mineral water, please.", "back": "Un gelato e un'acqua minerale, per favore.", "frontIt": false, "backIt": true, "note": null, "say": "Un gelato e un'acqua minerale, per favore.", "accept": ["Un gelato e un'acqua minerale.", "Un gelato e un'acqua minerale per favore"], "strict": false}, {"id": "444287e270", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a cappuccino and a beer, please.", "back": "Un cappuccino e una birra, per favore.", "frontIt": false, "backIt": true, "note": null, "say": "Un cappuccino e una birra, per favore.", "accept": ["Un cappuccino e una birra.", "Un cappuccino e una birra per favore"], "strict": false}, {"id": "fe22bc33c7", "cat": "dialogo", "dir": "drill", "kind": "Understand", "front": "“Ecco un cornetto e un gelato.” — “Quant'è?” — “Cinque euro.” How much?", "back": "€5", "frontIt": true, "backIt": false, "note": null, "say": null, "accept": null, "strict": false}, {"id": "0ee84449e9", "cat": "dialogo", "dir": "drill", "kind": "Understand", "front": "“Ecco un'aranciata e una Coca-Cola. Sei euro.” What was ordered, and how much?", "back": "An orangeade and a Coke, €6", "frontIt": true, "backIt": false, "note": null, "say": null, "accept": null, "strict": false}, {"id": "90166af726", "cat": "dialogo", "dir": "drill", "kind": "Understand", "front": "“Ecco due euro e dieci.” How much is the customer handing over?", "back": "€2.10", "frontIt": true, "backIt": false, "note": null, "say": null, "accept": null, "strict": false}, {"id": "723e9bb258", "cat": "dialogo", "dir": "drill", "kind": "Role play", "front": "You're the barista. A customer catches your eye. What do you say?", "back": "Dica?", "frontIt": false, "backIt": true, "note": null, "say": "Dica?", "accept": null, "strict": false}, {"id": "a4da4a60b4", "cat": "dialogo", "dir": "drill", "kind": "Role play", "front": "You're the customer. Get the barista's attention.", "back": "Scusi!", "frontIt": false, "backIt": true, "note": null, "say": "Scusi!", "accept": null, "strict": false}, {"id": "2395f52507", "cat": "dialogo", "dir": "drill", "kind": "Role play", "front": "Hand over the cappuccino.", "back": "Ecco un cappuccino.", "frontIt": false, "backIt": true, "note": null, "say": "Ecco un cappuccino.", "accept": null, "strict": false}, {"id": "24936c1a66", "cat": "dialogo", "dir": "drill", "kind": "Role play", "front": "Ask how much it is.", "back": "Quant'è?", "frontIt": false, "backIt": true, "note": null, "say": "Quant'è?", "accept": null, "strict": false}, {"id": "7c6889ded1", "cat": "dialogo", "dir": "drill", "kind": "Role play", "front": "Pay with a €5 note.", "back": "Ecco cinque euro.", "frontIt": false, "backIt": true, "note": null, "say": "Ecco cinque euro.", "accept": null, "strict": false}, {"id": "6683f540b4", "cat": "dialogo", "dir": "drill", "kind": "Role play", "front": "The customer says “Grazie.” You reply…", "back": "Prego.", "frontIt": false, "backIt": true, "note": null, "say": "Prego.", "accept": null, "strict": false}, {"id": "545f11950b", "cat": "dialogo", "dir": "drill", "kind": "Full scene", "front": "Play the whole scene: a cappuccino for €1.", "back": "Scusi! · Dica? · Un cappuccino, per favore. · Ecco un cappuccino. · Quant'è? · Un euro. · Ecco un euro. · Grazie. · Prego.", "frontIt": false, "backIt": true, "note": "The order of the dialogue from the activity book.", "say": "Scusi! · Dica? · Un cappuccino, per favore. · Ecco un cappuccino. · Quant'è? · Un euro. · Ecco un euro. · Grazie. · Prego.", "accept": null, "strict": false}], "notes": "<section>\n      <h2>At the bar<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Who<\/th><th>Italian<\/th><th>English<\/th><\/tr>\n        <tr><td>Customer<\/td><td class=\"it-cell\">Scusi!<\/td><td>Excuse me!<\/td><\/tr>\n        <tr><td>Barista<\/td><td class=\"it-cell\">Dica?<\/td><td>Yes? What can I get you?<\/td><\/tr>\n        <tr><td>Customer<\/td><td class=\"it-cell\">Un cappuccino, per favore.<\/td><td>A cappuccino, please.<\/td><\/tr>\n        <tr><td>Barista<\/td><td class=\"it-cell\">Ecco un cappuccino.<\/td><td>Here's a cappuccino.<\/td><\/tr>\n        <tr><td>Customer<\/td><td class=\"it-cell\">Quant'è?<\/td><td>How much is it?<\/td><\/tr>\n        <tr><td>Barista<\/td><td class=\"it-cell\">Un euro.<\/td><td>One euro.<\/td><\/tr>\n        <tr><td>Customer<\/td><td class=\"it-cell\">Ecco un euro.<\/td><td>Here's one euro.<\/td><\/tr>\n        <tr><td>Barista<\/td><td class=\"it-cell\">Grazie.<\/td><td>Thank you.<\/td><\/tr>\n        <tr><td>Customer<\/td><td class=\"it-cell\">Prego.<\/td><td>You're welcome.<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li><i>Ecco<\/i> means here is, here are, here you are. Use it for the order and for the money.<\/li>\n        <li><i>Per favore<\/i> is used less than “please” in English. A plain “Un caffè” with the right tone is polite.<\/li>\n        <li><i>Euro<\/i> never changes: <i>un euro, due euro, cinque euro<\/i>. Say all three vowels: e-u-ro.<\/li>\n        <li>Prices with cents: <i>due euro e dieci<\/i> (€2.10).<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>“A” at a glance<\/h2>\n      <div class=\"tbl-wrap\"><table class=\"glance\">\n        <tr><th>Noun<\/th><th>Article<\/th><th>Examples<\/th><\/tr>\n        <tr><td>Masculine<\/td><td class=\"it-cell\">un<\/td><td class=\"it-cell\">un caffè, un gelato, un Martini<\/td><\/tr>\n        <tr><td>Feminine, consonant<\/td><td class=\"it-cell\">una<\/td><td class=\"it-cell\">una birra, una Coca-Cola<\/td><\/tr>\n        <tr><td>Feminine, vowel<\/td><td class=\"it-cell\">un'<\/td><td class=\"it-cell\">un'aranciata, un'acqua minerale<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>These are the <b>indefinite articles<\/b>: “a” or “an”.<\/li>\n        <li><i>Una aranciata<\/i> runs two vowels together. Italian drops the A and writes an apostrophe: <i>un'aranciata<\/i>. Spanish keeps <i>una<\/i>.<\/li>\n        <li>Masculine <i>un<\/i> never takes an apostrophe.<\/li>\n        <li>Next week: <i>uno<\/i>, for masculine nouns starting with s + consonant or z.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Masculine or feminine<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Ending<\/th><th>Usually<\/th><th>Examples<\/th><\/tr>\n        <tr><td class=\"it-cell\">-o<\/td><td>masculine<\/td><td class=\"it-cell\">vino, gelato, cornetto, pacchetto, succo<\/td><\/tr>\n        <tr><td class=\"it-cell\">-a<\/td><td>feminine<\/td><td class=\"it-cell\">birra, aranciata, acqua, patatina<\/td><\/tr>\n        <tr><td class=\"it-cell\">-e<\/td><td>either<\/td><td>Learn each one with its article<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>Every noun is masculine or feminine. There is no neuter. Latin had one, and those nouns became masculine or feminine.<\/li>\n        <li>A noun keeps its gender for good.<\/li>\n        <li><i>Caffè<\/i>, <i>tè<\/i> and <i>cappuccino<\/i> are masculine. <i>Coca-Cola<\/i> is feminine.<\/li>\n        <li><i>Patatine<\/i> is plural. The singular is <i>patatina<\/i>.<\/li>\n        <li>Adjectives agree with their noun: <i>acqua minerale<\/i>. More on this later.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>C and G<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Spelling<\/th><th>Sound<\/th><th>Example<\/th><\/tr>\n        <tr><td class=\"it-cell\">ca, co, cu<\/td><td>hard “k”<\/td><td class=\"it-cell\">caffè, cornetto, succo<\/td><\/tr>\n        <tr><td class=\"it-cell\">ce, ci<\/td><td>soft “ch” (church)<\/td><td class=\"it-cell\">cappuccino, aranciata<\/td><\/tr>\n        <tr><td class=\"it-cell\">che, chi<\/td><td>hard “k” (key)<\/td><td class=\"it-cell\">pacchetto<\/td><\/tr>\n        <tr><td class=\"it-cell\">ge, gi<\/td><td>soft “j” (jet)<\/td><td class=\"it-cell\">gelato<\/td><\/tr>\n        <tr><td class=\"it-cell\">ghe, ghi<\/td><td>hard “g” (get)<\/td><td class=\"it-cell\">ghiaccio (ice)<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>The H makes C and G hard. English speakers often swap these, so practise them.<\/li>\n        <li>Italian is phonetic: you write what you hear. Double letters are the trap for now.<\/li>\n        <li>Accents mark a stressed last syllable: <i>caffè, tè, più<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Numbers in sums<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Italian<\/th><th>English<\/th><\/tr>\n        <tr><td class=\"it-cell\">Quanto fa tre più cinque?<\/td><td>What's 3 + 5?<\/td><\/tr>\n        <tr><td class=\"it-cell\">Fa otto.<\/td><td>It's 8.<\/td><\/tr>\n        <tr><td class=\"it-cell\">dodici meno quattro<\/td><td>12 − 4<\/td><\/tr>\n      <\/table><\/div>\n      <p class=\"src\">Numbers 0–12 are in the Lezione 2 deck.<\/p>\n    <\/section>\n\n    <section>\n      <h2>Culture<\/h2>\n      <ul>\n        <li>Tea comes with lemon, not milk. Ask if you want milk.<\/li>\n        <li><i>Un caffè<\/i> is an espresso.<\/li>\n        <li><i>Aranciata<\/i> is fizzy orange. <i>Succo d'arancia<\/i> is orange juice.<\/li>\n        <li>The barista's <i>Dica?<\/i> is quick and easy to miss.<\/li>\n      <\/ul>\n    <\/section>\n"}, {"id": "lezione-3", "eyebrow": "Italiano · Lezione 4", "title": "Un caffè bollente", "sub": "Ordering at the bar, making nouns plural, and adjectives that agree: hot and cold, and colours.", "cats": [["bar", "At the bar"], ["articoli", "Articles"], ["plurali", "Singular ↔ plural"], ["regole", "Plural rules"], ["temp", "Hot & cold"], ["accordo", "Adjectives agree"], ["colori", "Colours"], ["grammatica", "Grammar words"], ["suoni", "Sounds & spelling"], ["errori", "Mistakes to avoid"], ["dialogo", "Put it together"]], "cards": [{"id": "0fd9c0a441", "cat": "bar", "dir": "it-en", "kind": null, "front": "un cornetto", "back": "a croissant", "frontIt": true, "backIt": false, "note": null, "say": "un cornetto", "accept": null, "strict": false}, {"id": "cc8fed4a82", "cat": "bar", "dir": "en-it", "kind": null, "front": "a croissant", "back": "un cornetto", "frontIt": false, "backIt": true, "note": null, "say": "un cornetto", "accept": null, "strict": false}, {"id": "5c09c91603", "cat": "bar", "dir": "it-en", "kind": null, "front": "un panino prosciutto e formaggio", "back": "a ham and cheese sandwich", "frontIt": true, "backIt": false, "note": "In a café you can drop <i>con<\/i> (with).", "say": "un panino prosciutto e formaggio", "accept": null, "strict": false}, {"id": "6c28fe376d", "cat": "bar", "dir": "en-it", "kind": null, "front": "a ham and cheese sandwich", "back": "un panino prosciutto e formaggio", "frontIt": false, "backIt": true, "note": "In a café you can drop <i>con<\/i> (with).", "say": "un panino prosciutto e formaggio", "accept": null, "strict": false}, {"id": "2c471ca4eb", "cat": "bar", "dir": "it-en", "kind": null, "front": "una piadina", "back": "a filled flatbread", "frontIt" false}, {"id": "bb0c8ca173", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>ca, co, cu<\/i> sound like…", "back": "a hard “k”", "frontIt": false, "backIt": false, "note": "<i>caldo, cornetto, cuore<\/i>", "say": "caldo, cornetto", "accept": null, "strict": false}, {"id": "ef8f9ebe90", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>ce, ci<\/i> sound like…", "back": "a soft “ch”", "frontIt": false, "backIt": false, "note": "<i>cioccolata, Cinzano<\/i>", "say": "cioccolata, Cinzano", "accept": null, "strict": false}, {"id": "88bcf560ba", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "How do you keep the hard “k” before e or i?", "back": "Add an H: che, chi", "frontIt": false, "backIt": false, "note": "<i>succo → succhi, fresco → freschi, bianco → bianchi<\/i>", "say": "succhi, freschi, bianchi", "accept": null, "strict": false}, {"id": "ef2518fb66", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>ghi<\/i> in <i>ghiacciato<\/i> sounds like…", "back": "a hard “g”, as in give", "frontIt": false, "backIt": false, "note": "Without the H, <i>gi<\/i> sounds like “j”: <i>giallo<\/i>.", "say": "ghiacciato, giallo", "accept": null, "strict": false}, {"id": "fd3889f2b1", "cat": "suoni", "dir": "drill", "kind": "Sound", "front": "<i>gli<\/i> sounds like…", "back": "“lyee”, like the middle of million", "frontIt": false, "backIt": false, "note": null, "say": "gli spumanti", "accept": null, "strict": false}, {"id": "5a15c5b32e", "cat": "suoni", "dir": "drill", "kind": "Spell", "front": "Plural of <i>il succo<\/i>", "back": "i succhi", "frontIt": true, "backIt": true, "note": "Not <i>succi<\/i>, which would sound like “sooch-ee”.", "say": "i succhi", "accept": null, "strict": true}, {"id": "3efc2a56a2", "cat": "suoni", "dir": "drill", "kind": "Spell", "front": "Plural of <i>fresco<\/i> (masculine)", "back": "freschi", "frontIt": true, "backIt": true, "note": null, "say": "freschi", "accept": null, "strict": false}, {"id": "119d586a4c", "cat": "suoni", "dir": "drill", "kind": "Spell", "front": "Spell <i>spremuta<\/i> aloud", "back": "esse · pi · erre · e · emme · u · ti · a", "frontIt": false, "backIt": true, "note": null, "say": "esse, pi, erre, e, emme, u, ti, a", "accept": ["esse pi erre e emme u ti a"], "strict": false}, {"id": "73f221e3c4", "cat": "suoni", "dir": "drill", "kind": "Spell", "front": "Spell <i>ghiacciato<\/i>", "back": "g-h-i-a-c-c-i-a-t-o", "frontIt": false, "backIt": false, "note": "Double C.", "say": "ghiacciato", "accept": ["ghiacciato"], "strict": false}, {"id": "0ccfa102d6", "cat": "suoni", "dir": "drill", "kind": "Spell", "front": "Spell <i>bollente<\/i>", "back": "b-o-l-l-e-n-t-e", "frontIt": false, "backIt": false, "note": "Double L, and it ends in E.", "say": "bollente", "accept": ["bollente"], "strict": false}, {"id": "964c91c141", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “uno spremuta”", "back": "una spremuta", "frontIt": true, "backIt": true, "note": "<i>uno<\/i> is only for masculine nouns.", "say": "una spremuta", "accept": null, "strict": true}, {"id": "335be107ea", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “i caffè caldo”", "back": "i caffè caldi", "frontIt": true, "backIt": true, "note": "The noun stays the same, but the adjective goes plural.", "say": "i caffè caldi", "accept": null, "strict": true}, {"id": "a0cbdd3b74", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “le Coca-Cole”", "back": "le Coca-Cola", "frontIt": true, "backIt": true, "note": "Brand names don't change.", "say": "le Coca-Cola", "accept": null, "strict": true}, {"id": "2246eb62a4", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “l'acque minerali”", "back": "le acque minerali", "frontIt": true, "backIt": true, "note": "No apostrophe in the plural.", "say": "le acque minerali", "accept": null, "strict": true}, {"id": "5f68adfc43", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “i succi d'arancia”", "back": "i succhi d'arancia", "frontIt": true, "backIt": true, "note": "Keep the hard sound with an H.", "say": "i succhi d'arancia", "accept": null, "strict": true}, {"id": "52621e297b", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “i succhi d'arance”", "back": "i succhi d'arancia", "frontIt": true, "backIt": true, "note": "The oranges don't go plural. Only the juice does.", "say": "i succhi d'arancia", "accept": null, "strict": true}, {"id": "8f34179984", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “una cioccolata bollenta”", "back": "una cioccolata bollente", "frontIt": true, "backIt": true, "note": "Group 2 adjectives stay -e in the feminine.", "say": "una cioccolata bollente", "accept": null, "strict": true}, {"id": "849db91a75", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “le cioccolate molte calde”", "back": "le cioccolate molto calde", "frontIt": true, "backIt": true, "note": "<i>molto<\/i> is an adverb. It never changes.", "say": "le cioccolate molto calde", "accept": null, "strict": true}, {"id": "8d78104383", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “una fredda birra”", "back": "una birra fredda", "frontIt": true, "backIt": true, "note": "The adjective goes after the noun.", "say": "una birra fredda", "accept": null, "strict": true}, {"id": "1837ded659", "cat": "errori", "dir": "drill", "kind": "Fix it", "front": "Fix this: “una Coca-Cola freddo”", "back": "una Coca-Cola fredda", "frontIt": true, "backIt": true, "note": "Coca-Cola is feminine, so <i>fredda<\/i>.", "say": "una Coca-Cola fredda", "accept": null, "strict": true}, {"id": "196417aa07", "cat": "errori", "dir": "drill", "kind": "False friend", "front": "Does <i>caldo<\/i> mean hot or cold?", "back": "Hot", "frontIt": false, "backIt": false, "note": "It sounds like English “cold”. Don't be fooled.", "say": "caldo", "accept": null, "strict": false}, {"id": "f3fc6e26ec", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a barley coffee and a piadina", "back": "Un caffè d'orzo e una piadina, grazie.", "frontIt": false, "backIt": true, "note": null, "say": "Un caffè d'orzo e una piadina, grazie.", "accept": null, "strict": false}, {"id": "e91c197ac6", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order two chilled sparkling wines", "back": "Due spumanti freschi, grazie.", "frontIt": false, "backIt": true, "note": null, "say": "Due spumanti freschi, grazie.", "accept": null, "strict": false}, {"id": "86c2471945", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a freshly squeezed orange juice, not too cold", "back": "Una spremuta d'arancia non troppo fredda, grazie.", "frontIt": false, "backIt": true, "note": null, "say": "Una spremuta d'arancia non troppo fredda, grazie.", "accept": null, "strict": false}, {"id": "e85f574147", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a ham and cheese sandwich and an ice-cold beer", "back": "Un panino prosciutto e formaggio e una birra ghiacciata, grazie.", "frontIt": false, "backIt": true, "note": null, "say": "Un panino prosciutto e formaggio e una birra ghiacciata, grazie.", "accept": null, "strict": false}, {"id": "797a64ae01", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order two boiling hot chocolates", "back": "Due cioccolate bollenti, grazie.", "frontIt": false, "backIt": true, "note": null, "say": "Due cioccolate bollenti, grazie.", "accept": null, "strict": false}, {"id": "2be5a2a737", "cat": "dialogo", "dir": "drill", "kind": "Order", "front": "Order a strawberry smoothie and a croissant", "back": "Un frullato di fragole e un cornetto, grazie.", "frontIt": false, "backIt": true, "note": null, "say": "Un frullato di fragole e un cornetto, grazie.", "accept": null, "strict": false}, {"id": "e30d8b01f7", "cat": "dialogo", "dir": "drill", "kind": "Understand", "front": "“Due caffè bollenti e una spremuta, grazie.” What's the order?", "back": "Two boiling hot coffees and a freshly squeezed juice", "frontIt": true, "backIt": false, "note": null, "say": "Due caffè bollenti e una spremuta, grazie.", "accept": null, "strict": false}, {"id": "0c43c29516", "cat": "dialogo", "dir": "drill", "kind": "Understand", "front": "“Una bottiglia di vino rosso e due acque minerali.” What's the order?", "back": "A bottle of red wine and two mineral waters", "frontIt": true, "backIt": false, "note": null, "say": "Una bottiglia di vino rosso e due acque minerali.", "accept": null, "strict": false}, {"id": "791e281e49", "cat": "dialogo", "dir": "drill", "kind": "Revision", "front": "Write a WhatsApp hello to the class group: greet everyone, your name, where you live", "back": "Ciao a tutti! Mi chiamo Giulio. Abito a Oxford, in Inghilterra.", "frontIt": false, "backIt": true, "note": "Swap in your own details. From the revision task at the start of the lesson.", "say": "Ciao a tutti! Mi chiamo Giulio. Abito a Oxford, in Inghilterra.", "accept": null, "strict": false}, {"id": "81db62dff7", "cat": "dialogo", "dir": "drill", "kind": "Revision", "front": "Ask a classmate their name and how to spell it", "back": "Come ti chiami? · Come si scrive?", "frontIt": false, "backIt": true, "note": null, "say": "Come ti chiami? · Come si scrive?", "accept": ["come ti chiami come si scrive"], "strict": false}], "notes": "<section>\n      <h2>Grammar words<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Word type<\/th><th>What it does<\/th><th>Examples<\/th><\/tr>\n        <tr><td><b>Noun<\/b><\/td><td>Names a thing, person, place or idea<\/td><td>caffè, birra, finestra, amore<\/td><\/tr>\n        <tr><td><b>Verb<\/b><\/td><td>An action word: what you do<\/td><td>abitare, parlare, scrivere<\/td><\/tr>\n        <tr><td><b>Adjective<\/b><\/td><td>Describes a noun<\/td><td>caldo, freddo, rosso, italiano<\/td><\/tr>\n        <tr><td><b>Adverb<\/b><\/td><td>Describes an adjective or verb<\/td><td>molto, troppo<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>A noun has a fixed gender. It can only change number (singular to plural).<\/li>\n        <li>An adjective changes gender <b>and<\/b> number to match its noun.<\/li>\n        <li>Adverbs never change: <i>molto calda<\/i>, <i>molto caldi<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Articles<\/h2>\n      <div class=\"tbl-wrap\"><table class=\"glance\">\n        <tr><th><\/th><th>a / an<\/th><th>the<\/th><th>the (plural)<\/th><\/tr>\n        <tr><td>Masculine<\/td><td class=\"it-cell\">un<\/td><td class=\"it-cell\">il<\/td><td class=\"it-cell\">i<\/td><\/tr>\n        <tr><td>Masculine, s + consonant or z<\/td><td class=\"it-cell\">uno<\/td><td class=\"it-cell\">lo<\/td><td class=\"it-cell\">gli<\/td><\/tr>\n        <tr><td>Masculine, vowel<\/td><td class=\"it-cell\">un<\/td><td class=\"it-cell\">l'<\/td><td class=\"it-cell\">gli<\/td><\/tr>\n        <tr><td>Feminine<\/td><td class=\"it-cell\">una<\/td><td class=\"it-cell\">la<\/td><td class=\"it-cell\">le<\/td><\/tr>\n        <tr><td>Feminine, vowel<\/td><td class=\"it-cell\">un'<\/td><td class=\"it-cell\">l'<\/td><td class=\"it-cell\">le<\/td><\/tr>\n      <\/table><\/div>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Noun<\/th><th>a / an<\/th><th>the<\/th><th>the (plural)<\/th><\/tr>\n        <tr><td>Masculine<\/td><td class=\"it-cell\">un panino<\/td><td class=\"it-cell\">il panino<\/td><td class=\"it-cell\">i panini<\/td><\/tr>\n        <tr><td>Masculine, s + consonant or z<\/td><td class=\"it-cell\">uno spumante<\/td><td class=\"it-cell\">lo spumante<\/td><td class=\"it-cell\">gli spumanti<\/td><\/tr>\n        <tr><td>Masculine, vowel<\/td><td class=\"it-cell\">un espresso<\/td><td class=\"it-cell\">l'espresso<\/td><td class=\"it-cell\">gli espressi<\/td><\/tr>\n        <tr><td>Feminine<\/td><td class=\"it-cell\">una birra<\/td><td class=\"it-cell\">la birra<\/td><td class=\"it-cell\">le birre<\/td><\/tr>\n        <tr><td>Feminine, vowel<\/td><td class=\"it-cell\">un'aranciata<\/td><td class=\"it-cell\">l'aranciata<\/td><td class=\"it-cell\">le aranciate<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li><i>uno / lo / gli<\/i> are for <b>masculine<\/b> nouns only. A feminine noun starting with sp- still takes <i>una / la<\/i>: <i>una spremuta<\/i>.<\/li>\n        <li>Never use an apostrophe in the plural: <i>le acque<\/i>, not <i>l'acque<\/i>.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Making nouns plural<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>Singular ends in<\/th><th>Usually<\/th><th>Plural<\/th><th>Example<\/th><\/tr>\n        <tr><td>-a<\/td><td>feminine<\/td><td>-e<\/td><td class=\"it-cell\">la limonata → le limonate<\/td><\/tr>\n        <tr><td>-o<\/td><td>masculine<\/td><td>-i<\/td><td class=\"it-cell\">il cornetto → i cornetti<\/td><\/tr>\n        <tr><td>-e<\/td><td>either (each noun fixed)<\/td><td>-i<\/td><td class=\"it-cell\">lo spumante → gli spumanti<\/td><\/tr>\n        <tr><td>accented vowel<\/td><td>either<\/td><td>no change<\/td><td class=\"it-cell\">il caffè → i caffè<\/td><\/tr>\n        <tr><td>brand name<\/td><td>either<\/td><td>no change<\/td><td class=\"it-cell\">la Coca-Cola → le Coca-Cola<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>Only the last letter changes. The article changes too.<\/li>\n        <li>In <i>il succo d'arancia<\/i>, only the juice goes plural: <i>i succhi d'arancia<\/i>.<\/li>\n        <li>Add an H to keep a hard sound: <i>succo → succhi<\/i>, <i>fresco → freschi<\/i>, <i>bianco → bianchi<\/i>.<\/li>\n        <li>More examples: <i>casa → case<\/i> (house), <i>finestra → finestre<\/i> (window), <i>porta → porte<\/i> (door), <i>quaderno → quaderni<\/i> (exercise book).<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Adjectives: two groups<\/h2>\n      <p>Learn the dictionary form (masculine singular). Its last letter tells you the group.<\/p>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th><\/th><th>Masc. sing.<\/th><th>Fem. sing.<\/th><th>Masc. plural<\/th><th>Fem. plural<\/th><\/tr>\n        <tr><td>Group 1: -o<\/td><td class=\"it-cell\">caldo<\/td><td class=\"it-cell\">calda<\/td><td class=\"it-cell\">caldi<\/td><td class=\"it-cell\">calde<\/td><\/tr>\n        <tr><td>Group 2: -e<\/td><td class=\"it-cell\">bollente<\/td><td class=\"it-cell\">bollente<\/td><td class=\"it-cell\">bollenti<\/td><td class=\"it-cell\">bollenti<\/td><\/tr>\n      <\/table><\/div>\n      <ul>\n        <li>The adjective goes <b>after<\/b> the noun: <i>una birra fredda<\/i>, a cold beer.<\/li>\n        <li><i>un caffè caldo → i caffè caldi<\/i>. The noun stays the same and the adjective still goes plural.<\/li>\n        <li><i>Sono italiano / italiana<\/i>: nationalities are adjectives too.<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h2>Hot and cold<\/h2>\n      <div class=\"grid-cells\">\n        <div class=\"cell\"><span class=\"k\">boiling hot<\/span><span class=\"v\">bollente<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">very hot<\/span><span class=\"v\">molto caldo<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">hot<\/span><span class=\"v\">caldo<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">not too hot<\/span><span class=\"v\">non troppo caldo<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">chilled, fresh<\/span><span class=\"v\">fresco<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">not too cold<\/span><span class=\"v\">non troppo freddo<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">cold<\/span><span class=\"v\">freddo<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">very cold<\/span><span class=\"v\">molto freddo<\/span><\/div>\n        <div class=\"cell\"><span class=\"k\">ice-cold<\/span><span class=\"v\">ghiacciato<\/span><\/div>\n      <\/div>\n      <p class=\"src\">Watch out: <i>caldo<\/i> means hot. It sounds like English “cold”.<\/p>\n    <\/section>\n\n    <section>\n      <h2>Colours<\/h2>\n      <div class=\"tbl-wrap\"><table>\n        <tr><th>English<\/th><th>Masc. sing.<\/th><th>Fem. sing.<\/th><th>Masc. plural<\/th><th>Fem. plural<\/th><\/tr>\n        <tr><td>black<\/td><td class=\"it-cell\">nero<\/td><td class=\"it-cell\">nera<\/td><td class=\"it-cell\">neri<\/td><td class=\"it-cell\">nere<\/td><\/tr>\n        <tr><td>red<\/td><td class=\"it-cell\">rosso<\/td><td class=\"it-cell\">rossa<\/td><td class=\"it-cell\">rossi<\/td><td class=\"it-cell\">rosse<\/td><\/tr>\n        <tr><td>yellow<\/td><td class=\"it-cell\">giallo<\/td><td class=\"it-cell\">gialla<\/td><td class=\"it-cell\">gialli<\/td><td class=\"it-cell\">gialle<\/td><\/tr>\n        <tr><td>light blue<\/td><td class=\"it-cell\">azzurro<\/td><td class=\"it-cell\">azzurra<\/td><td class=\"it-cell\">azzurri<\/td><td class=\"it-cell\">azzurre<\/td><\/tr>\n        <tr><td>white<\/td><td class=\"it-cell\">bianco<\/td><td class=\"it-cell\">bianca<\/td><td class=\"it-cell\">bianchi<\/td><td class=\"it-cell\">bianche<\/td><\/tr>\n        <tr><td>green<\/td><td class=\"it-cell\">verde<\/td><td class=\"it-cell\">verde<\/td><td class=\"it-cell\">verdi<\/td><td class=\"it-cell\">verdi<\/td><\/tr>\n      <\/table><\/div>\n      <p class=\"src\"><i>Gli Azzurri<\/i> is the nickname of Italy's national football team.<\/p>\n    <\/section>\n\n    <section>\n      <h2>At the bar<\/h2>\n      <ul>\n        <li><b>La piadina<\/b>: a flatbread, filled like a sandwich, eaten hot or cold. More common in the north (Bologna, Milan).<\/li>\n        <li><b>Il caffè d'orzo<\/b>: barley “coffee”, made like an espresso. <i>Orzo<\/i> = barley.<\/li>\n        <li><b>La spremuta d'arancia<\/b> is freshly squeezed (<i>spremere<\/i> = to squeeze). <b>Il succo d'arancia<\/b> is the shop-bought juice.<\/li>\n        <li>In a café you can drop <i>con<\/i>: <i>un panino prosciutto e formaggio<\/i>.<\/li>\n        <li>In summer Italians drink <i>caffè freddo<\/i> and <i>granita di caffè<\/i>, coffee granita often served with cream.<\/li>\n      <\/ul>\n    <\/section>"}, {"id": "lezione-7", "eyebrow": "Italiano · Lezione 7", "title": "Qualcosa da mangiare", "sub": "Snacks and juices at the bar, the full set of “the” articles, plurals with “a portion of…”, and adjectives that agree.", "cats": [["nuovo", "New words"], ["articoli", "“The” in Italian"], ["plurali", "Singular ↔ plural"], ["di", "A portion of…"], ["accordo", "Adjectives agree"], ["bar", "Ordering (book ex. 8)"], ["cocktail", "Cocktail words"], ["cultura", "Culture"], ["errori", "Mistakes to avoid"], ["dialogo", "Put it together"]], "cards": [{"id": "89fcc881d7", "cat": "nuovo", "dir": "it-en", "kind": null, "front": "qualcosa da mangiare", "back": "something to eat", "frontIt": true, "backIt": false, "note": "The lesson title.", "say": "qualcosa da mangiare", "accept": null, "strict": false}, {"id": "495472d682", "cat": "nuovo", "dir": "en-it", "kind": null, "front": "something to eat", "back": "qualcosa da mangiare", "frontIt": false, "backIt": true, "note": "The lesson title.", "say": "qualcosa da mangiare", "accept": null, "strict": false}, {"id": "aba08e219e", "cat": "nuovo", "dir": "it-en", "kind": null, "front": "mangiare", "back": "to eat", "frontIt": true, "backIt": false, "note": null, "say": "mangiare", "accept": null, "strict": false}, {"id": "40446bfb3b", "cat": "nuovo", "dir": "en-it", "kind": null, "front": "to eat", "back": "mangiare", "frontIt": false, "backIt": true, "note": null, "say": "mangiare", "accept": null, "strict": false}, {"id": "a6198f101f", "cat": "nuovo", "dir": "it-en", "kind": null, "front": "il pranzo", "back": "lunch", "frontIt": true, "backIt": false, "note": null, "say": "il pranzo", "accept": null, "strict": false}, {"id": "e5cfb4b373", "cat": "nuovo", "dir": "en-it", "kind": null, "front": "lunch", "back": "il pranzo", "frontIt": false, "backIt": true
